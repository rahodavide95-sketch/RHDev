name: Prova quotazioni (temporanea)
on:
  push:
    branches: [claude/diag-quotes]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Codice vero dell'app contro onvista
        run: |
          cat > /tmp/live.mjs <<'JS'
          const M = await import(process.env.GITHUB_WORKSPACE + '/finanza-personale/js/market.js');
          const D = await import(process.env.GITHUB_WORKSPACE + '/finanza-personale/js/data/markets.js');
          const fmt = n => (n == null ? '—' : Number(n).toFixed(4));
          console.log('== Titoli del foglio di D (solo nome)');
          const names = ['Vanguard S&P 500 UCITS ETF', 'iShares Core MSCI Emerging Markets IMI UCITS ETF', 'Xtrackers EUR High Yield Corporate Bond UCITS ETF', 'Invesco Physical Gold A', 'Xtrackers II EUR Overnight Rate Swap UCITS ETF', 'VanEck Space Innovators UCITS ETF', 'Rocket Lab'];
          for (const n of names) {
            try {
              const c = await M.findCandidates({ name: n });
              const best = c[0];
              const q = await M.quote({ isin: best.isin, type: best.type, currency: 'EUR' }, '1M');
              console.log(`${n} → ${best.name} ${best.isin} (${best.type}, punteggio ${best.score.toFixed(2)}; altri: ${c.slice(1, 3).map(x => x.isin).join(',')}) = ${fmt(q.price)} ${q.currency} ${q.venue}, ${q.closes.length} chiusure`);
            } catch (e) { console.log(`${n} → ERRORE ${e.message}`); }
          }
          console.log('== Intervalli del grafico');
          for (const r of ['1G', '1S', '1M', '3M', '6M', 'YTD', '1A', '5A', 'Max']) {
            try { const q = await M.quote({ isin: 'IE00BFMXXD54', type: 'FUND', currency: 'EUR' }, r); console.log(r, q.closes.length, 'chiusure, dal', q.stamps[0] ? new Date(q.stamps[0] * 1000).toISOString().slice(0, 10) : '—', 'var', q.change?.toFixed(2)); } catch (e) { console.log(r, 'ERRORE', e.message); }
          }
          console.log('== Pagina Mercati');
          let ok = 0, ko = 0;
          for (const [cat, items] of Object.entries(D.MKT_CATEGORIES)) {
            if (cat === 'Crypto') continue;
            for (const it of items) {
              try { const q = await M.quote({ ...it, category: cat }, '1M'); ok++; console.log(`ok  ${cat} | ${it.name} → ${q.name} = ${fmt(q.price)} ${q.currency || 'pt'} (${q.closes.length})`); }
              catch (e) { ko++; console.log(`NO  ${cat} | ${it.name} (${it.symbol}) → ${e.message}`); }
            }
          }
          console.log('== Ricerca locale con ISIN');
          let wi = 0;
          for (const x of D.SEARCH_DB.filter(x => x.isin).slice(0, 15)) { try { const q = await M.quote({ symbol: x.s, name: x.n, isin: x.isin }, '1M'); wi++; console.log('ok', x.n, x.isin, fmt(q.price), q.currency); } catch (e) { console.log('NO', x.n, x.isin, e.message); } }
          console.log(`TOTALE Mercati: ${ok} ok, ${ko} non trovati`);
          JS
          node /tmp/live.mjs
