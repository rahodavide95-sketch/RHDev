<script>
/* Motore di calcolo: eventi -> cessioni, proventi, movimenti per conto, problemi.
   Un dato mancante o ambiguo NON viene mai risolto in silenzio: genera un problema "block" e il calcolo
   prosegue con l'ipotesi piu' prudente (costo zero / valore zero), cosi' l'impatto resta visibile. */
(function () {
  'use strict';
  const CT = (globalThis.CT = globalThis.CT || {});
  const { D, ZERO, Kind, classify, taxDate, STABLE, FIAT } = CT;

  const REBASE_DAY = '2025-01-01';
  const NEW_REGIME_DAY = '2023-01-01'; // dal 2023 le permute cripto-cripto sono realizzi imponibili
  const WALLET = 'Wallet personale';

  // ------------------------------------------------------------ prezzi
  class PriceBook {
    constructor() { this.manual = new Map(); this.implied = new Map(); this.impliedDays = new Map(); }
    key(sym, day) { return `${sym.toUpperCase()}|${day}`; }
    setManual(sym, day, price) { this.manual.set(this.key(sym, day), D(price)); }
    clearManual(sym, day) { this.manual.delete(this.key(sym, day)); }
    addImplied(sym, day, price) {
      const k = this.key(sym, day);
      const cur = this.implied.get(k) || { sum: ZERO, n: 0 };
      cur.sum = cur.sum.plus(price); cur.n += 1;
      this.implied.set(k, cur);
      const s = sym.toUpperCase();
      if (!this.impliedDays.has(s)) this.impliedDays.set(s, new Set());
      this.impliedDays.get(s).add(day);
    }
    /** {price, src:'manuale'|'dedotto'} oppure null */
    get(sym, day) {
      const k = this.key(sym, day);
      if (this.manual.has(k)) return { price: this.manual.get(k), src: 'manuale' };
      const i = this.implied.get(k);
      if (i) return { price: i.sum.div(i.n), src: 'dedotto' };
      return null;
    }
    /** Prezzo noto piu' vicino (per suggerimenti), cercando tra le operazioni dell'utente. */
    nearest(sym, day) {
      const days = this.impliedDays.get(sym.toUpperCase());
      if (!days) return null;
      let best = null, bestDiff = Infinity;
      const t0 = Date.parse(day + 'T00:00:00Z');
      for (const d of days) {
        const diff = Math.abs(Date.parse(d + 'T00:00:00Z') - t0);
        if (diff < bestDiff) { bestDiff = diff; best = d; }
      }
      if (!best) return null;
      return { day: best, price: this.get(sym, best).price, daysApart: Math.round(bestDiff / 86400000) };
    }
  }

  // ------------------------------------------------------------ lotti LIFO
  class LotPool {
    constructor(asset) { this.asset = asset; this.lots = []; }
    get balance() { return this.lots.reduce((s, l) => s.plus(l.qty), ZERO); }
    add(lot) {
      this.lots.push(lot);
      this.lots.sort((a, b) => a.ts - b.ts); // stabile: a pari data resta l'ordine di inserimento
    }
    /** LIFO: ritorna { uses, short } */
    consume(qty) {
      let remaining = qty;
      const uses = [];
      while (remaining.gt(0) && this.lots.length) {
        const lot = this.lots[this.lots.length - 1];
        const take = lot.qty.lt(remaining) ? lot.qty : remaining;
        uses.push({ lotId: lot.id, ts: lot.ts, day: taxDate(lot.ts), qty: take, cost: take.times(lot.unitCost), documented: lot.documented, rebased: lot.rebased, origin: lot.origin });
        lot.qty = lot.qty.minus(take);
        remaining = remaining.minus(take);
        if (lot.qty.isZero()) this.lots.pop();
      }
      return { uses, short: remaining };
    }
  }

  // ------------------------------------------------------------ motore
  class Engine {
    constructor(opts) {
      this.opts = Object.assign({ rebase2025: false, resolutions: {}, transferWindowH: 72, transferFeeTol: D('0.10'), prices: new PriceBook() }, opts || {});
      this.prices = this.opts.prices;
      this.pools = new Map();
      this.disposals = []; this.incomes = []; this.movements = []; this.issues = [];
      this.missingPrices = new Map(); // "SYM|day" -> {symbol, day}
      this.stats = {};
      this.rebaseTotal = ZERO;
      this._classes = new Map();
      this._seq = 0;
      this._rebased = false;
    }

    issue(level, code, uid, message, data) { this.issues.push({ level, code, uid, message, data: data || {} }); }
    pool(a) { if (!this.pools.has(a)) this.pools.set(a, new LotPool(a)); return this.pools.get(a); }
    cls(asset, hint) {
      if (hint) this._classes.set(asset, classify(asset, hint));
      if (!this._classes.has(asset)) this._classes.set(asset, classify(asset));
      return this._classes.get(asset);
    }
    need(sym, ts) { const day = taxDate(ts); this.missingPrices.set(`${sym.toUpperCase()}|${day}`, { symbol: sym.toUpperCase(), day }); }

    toEur(amount, ccy, e) {
      if (ccy === 'EUR') return amount;
      const p = this.prices.get(ccy, taxDate(e.ts));
      if (p) return amount.times(p.price);
      this.need(ccy, e.ts);
      this.issue('block', 'missing_price', e.uid, `Manca il cambio ${ccy}/EUR del ${taxDate(e.ts)}`, { symbol: ccy, day: taxDate(e.ts) });
      return null;
    }

    /** Controvalore EUR della gamba principale: valore dalla fonte > prezzo del giorno x quantita'. */
    valueEur(e) {
      if (e.value !== null && e.value !== undefined) {
        const v = this.toEur(e.value, e.valueCcy, e);
        if (v !== null) return { v, src: 'dal file' };
      }
      const day = taxDate(e.ts);
      if (e.asset) {
        const p = this.prices.get(e.asset, day);
        if (p) return { v: p.price.times(e.qty), src: p.src === 'manuale' ? 'prezzo inserito' : 'prezzo dedotto dalle tue operazioni' };
      }
      if (e.counterAsset && !e.counterQty.isZero()) {
        const p = this.prices.get(e.counterAsset, day);
        if (p) return { v: p.price.times(e.counterQty), src: p.src === 'manuale' ? 'prezzo inserito' : 'prezzo dedotto dalle tue operazioni' };
      }
      this.need(e.asset || e.counterAsset, e.ts);
      this.issue('block', 'missing_value', e.uid, `Impossibile valorizzare in euro ${e.qty.toFixed()} ${e.asset} del ${day}: manca il prezzo`, { symbol: e.asset, day });
      return { v: ZERO, src: 'MANCANTE' };
    }

    feeEur(e) {
      if (e.feeQty.isZero() && (e.feeValue === null || e.feeValue === undefined)) return ZERO;
      if (e.feeValue !== null && e.feeValue !== undefined) { const v = this.toEur(e.feeValue, e.feeValueCcy, e); return v === null ? ZERO : v; }
      if (e.feeAsset === 'EUR') return e.feeQty;
      if (classify(e.feeAsset) === 'fiat') { const v = this.toEur(e.feeQty, e.feeAsset, e); return v === null ? ZERO : v; }
      const p = this.prices.get(e.feeAsset, taxDate(e.ts));
      if (!p) {
        this.need(e.feeAsset, e.ts);
        this.issue('block', 'missing_price', e.uid, `Manca il prezzo di ${e.feeAsset} per valorizzare la commissione del ${taxDate(e.ts)}`, { symbol: e.feeAsset, day: taxDate(e.ts) });
        return ZERO;
      }
      return p.price.times(e.feeQty);
    }

    /** Valore in EUR dichiarato dal file per un trasferimento (se c'e'): serve solo al prospetto RW. */
    hint(e) { return e.value !== null && e.value !== undefined && e.valueCcy === 'EUR' ? e.value : null; }
    move(e, account, asset, delta, eur) { this.movements.push({ ts: e.ts, day: taxDate(e.ts), account, asset, delta, eur: eur === undefined ? null : eur, uid: e.uid }); }

    acquire(e, asset, qty, cost, documented = true, ts = null) {
      if (qty.isZero()) return;
      this.pool(asset).add({ id: `L${String(++this._seq).padStart(6, '0')}`, asset, ts: ts || e.ts, qty, unitCost: cost.div(qty), origin: e.uid, documented, rebased: false });
    }

    dispose(e, uid, asset, qty, proceeds, fee, kind, source, note) {
      const pool = this.pool(asset);
      let { uses, short } = pool.consume(qty);
      if (short.gt(0)) {
        const res = this.opts.resolutions[uid];
        if (res && res.action === 'cover_cost') {
          const when = res.acquired ? new Date(res.acquired + 'T00:00:00Z') : new Date(e.ts.getTime() - 1000);
          pool.add({ id: `L${String(++this._seq).padStart(6, '0')}`, asset, ts: when, qty: short, unitCost: D(res.cost_eur).div(short), origin: 'manuale', documented: true, rebased: false });
          const more = pool.consume(short);
          uses = uses.concat(more.uses);
          short = more.short;
          this.issue('info', 'resolved_cover_cost', uid, `Costo del mancante impostato manualmente: ${res.cost_eur} €`);
        }
        if (short.gt(0)) {
          this.issue('block', 'missing_history', uid,
            `Vendita/uso di ${CT.fq(qty)} ${asset} del ${taxDate(e.ts)}, ma dai file risultano solo ${CT.fq(qty.minus(short))} disponibili: mancano ${CT.fq(short)}.`,
            { asset, qty: short, day: taxDate(e.ts), account: e.account });
          uses.push({ lotId: 'MANCANTE', ts: e.ts, day: taxDate(e.ts), qty: short, cost: ZERO, documented: false, rebased: false, origin: '' });
        }
      }
      const cost = uses.reduce((s, u) => s.plus(u.cost), ZERO);
      const d = { uid, ts: e.ts, day: taxDate(e.ts), year: CT.yearOf(taxDate(e.ts)), account: e.account, asset, cls: this.cls(asset, asset === e.asset ? e.assetHint : null),
        kind, qty, proceeds, fee, cost, gain: proceeds.minus(cost), uses, source, src: e.src, note: note || '' };
      this.disposals.push(d);
      return d;
    }

    feeDisposal(e, feeEur) {
      if (!e.feeAsset || e.feeQty.isZero() || classify(e.feeAsset) === 'fiat') return;
      this.move(e, e.account, e.feeAsset, e.feeQty.neg(), feeEur);
      this.dispose(e, e.uid + '#fee', e.feeAsset, e.feeQty, feeEur, ZERO, 'fee', 'commissione');
    }

    // -------------------------------------------------------- preparazione
    prepare(events) {
      const out = [];
      const sorted = events.map((e, i) => [e, i]).sort((a, b) => (a[0].ts - b[0].ts) || (a[1] - b[1]));
      for (let [e] of sorted) {
        const r = this.opts.resolutions[e.uid];
        if (r) {
          if (r.action === 'ignore') { this.issue('info', 'resolved_ignore', e.uid, 'Riga ignorata su tua richiesta'); continue; }
          if (r.action === 'set_value') { e = Object.assign({}, e, { value: D(r.value_eur), valueCcy: 'EUR' }); this.issue('info', 'resolved_value', e.uid, `Valore impostato manualmente: ${r.value_eur} €`); }
        }
        out.push(e);
      }
      return out;
    }

    collectImplied(events) {
      for (const e of events) {
        if (e.value === null || e.value === undefined || e.valueCcy !== 'EUR') continue;
        const day = taxDate(e.ts);
        if ((e.kind === Kind.BUY || e.kind === Kind.SELL || e.kind === Kind.INCOME || e.kind === Kind.SPEND) && e.asset && e.qty.gt(0) && !FIAT.has(e.asset)) {
          this.prices.addImplied(e.asset, day, e.value.div(e.qty));
        } else if (e.kind === Kind.SWAP) {
          if (e.qty.gt(0)) this.prices.addImplied(e.asset, day, e.value.div(e.qty));
          if (e.counterQty.gt(0)) this.prices.addImplied(e.counterAsset, day, e.value.div(e.counterQty));
        }
      }
    }

    matchTransfers(evs) {
      const outs = evs.filter((e) => e.kind === Kind.TRANSFER_OUT);
      const ins = evs.filter((e) => e.kind === Kind.TRANSFER_IN);
      const win = this.opts.transferWindowH * 3600000;
      const used = new Set();
      const pair = new Map();
      for (const o of outs) {
        let best = null;
        for (const i of ins) {
          if (used.has(i.uid) || i.account === o.account || i.asset !== o.asset) continue;
          const dt = Math.abs(i.ts - o.ts);
          if (dt > win || i.qty.gt(o.qty)) continue;
          const fee = o.qty.minus(i.qty);
          if (fee.gt(o.qty.times(this.opts.transferFeeTol))) continue;
          if (!best || dt < best.dt || (dt === best.dt && fee.lt(best.fee))) best = { i, dt, fee };
        }
        if (best) { used.add(best.i.uid); pair.set(o.uid, best.i); pair.set(best.i.uid, o); }
      }
      return pair;
    }

    rebase() {
      this._rebased = true;
      for (const [asset, pool] of this.pools) {
        if (this.cls(asset) !== 'crypto' || pool.balance.isZero()) continue;
        const p = this.prices.get(asset, REBASE_DAY);
        if (!p) {
          this.missingPrices.set(`${asset.toUpperCase()}|${REBASE_DAY}`, { symbol: asset.toUpperCase(), day: REBASE_DAY });
          this.issue('block', 'missing_price', '', `Per la rideterminazione serve il prezzo di ${asset} al 1/1/2025`, { symbol: asset.toUpperCase(), day: REBASE_DAY });
          continue;
        }
        for (const lot of pool.lots) { lot.unitCost = p.price; lot.rebased = true; lot.documented = true; }
        this.rebaseTotal = this.rebaseTotal.plus(pool.balance.times(p.price));
      }
    }

    // -------------------------------------------------------- ciclo principale
    run(events) {
      this.collectImplied(events);
      const evs = this.prepare(events);
      const pair = this.matchTransfers(evs);
      for (const e of evs) {
        if (this.opts.rebase2025 && !this._rebased && taxDate(e.ts) >= REBASE_DAY) this.rebase();
        this.stats[e.kind] = (this.stats[e.kind] || 0) + 1;
        this.handle(e, pair);
      }
      if (this.opts.rebase2025 && !this._rebased) this.rebase();
      return this;
    }

    handle(e, pair) {
      const k = e.kind;
      if (k === Kind.INFO || k === Kind.FIAT_IN || k === Kind.FIAT_OUT) return;
      if (k === Kind.UNRESOLVED) { this.issue('block', 'unrecognized_row', e.uid, e.note || 'Riga non riconosciuta', { key: e.unkKey, src: e.src }); return; }
      const cls = e.asset ? this.cls(e.asset, e.assetHint) : 'other';
      if (k !== Kind.TRANSFER_IN && k !== Kind.TRANSFER_OUT && (cls === 'other' || cls === 'fiat')) {
        this.issue('warn', 'out_of_scope', e.uid, `Operazione su ${e.asset} (${cls === 'other' ? 'azioni/ETF o altro' : 'valuta'}) fuori dal perimetro di questa versione: ignorata`, { asset: e.asset });
        return;
      }
      if (k === Kind.BUY) {
        const { v } = this.valueEur(e); const fee = this.feeEur(e);
        this.acquire(e, e.asset, e.qty, v.plus(fee));
        this.move(e, e.account, e.asset, e.qty, v.plus(fee));
        this.feeDisposal(e, fee);
      } else if (k === Kind.SELL || k === Kind.SPEND) {
        const { v, src } = this.valueEur(e); const fee = this.feeEur(e);
        this.move(e, e.account, e.asset, e.qty.neg(), v);
        this.dispose(e, e.uid, e.asset, e.qty, v.minus(fee), fee, k, src, e.note);
        this.feeDisposal(e, fee);
      } else if (k === Kind.SWAP) {
        if (!e.counterAsset || classify(e.counterAsset) === 'fiat') { this.issue('block', 'unrecognized_row', e.uid, 'Permuta senza asset di destinazione valido'); return; }
        const { v, src } = this.valueEur(e); const fee = this.feeEur(e);
        if (STABLE.has(e.asset) && STABLE.has(e.counterAsset)) {
          this.issue('info', 'stable_swap', e.uid, `Scambio tra stablecoin ${e.asset}→${e.counterAsset}: trattato come permuta imponibile (scelta prudenziale).`);
        }
        this.move(e, e.account, e.asset, e.qty.neg(), v);
        if (taxDate(e.ts) < NEW_REGIME_DAY) {
          // Prima del 2023 la permuta cripto-cripto non era un realizzo: il costo si trasferisce al nuovo asset.
          const { uses, short } = this.pool(e.asset).consume(e.qty);
          let cost = uses.reduce((s, u) => s.plus(u.cost), ZERO);
          if (short.gt(0)) this.issue('block', 'missing_history', e.uid, `Permuta di ${CT.fq(e.qty)} ${e.asset} del ${taxDate(e.ts)}: mancano ${CT.fq(short)} negli acquisti caricati.`, { asset: e.asset, qty: short, day: taxDate(e.ts), account: e.account });
          this.acquire(e, e.counterAsset, e.counterQty, cost, short.isZero());
        } else {
          this.dispose(e, e.uid, e.asset, e.qty, v.minus(fee), fee, 'swap', src, e.note);
          this.acquire(e, e.counterAsset, e.counterQty, v);
        }
        this.move(e, e.account, e.counterAsset, e.counterQty, v);
        this.feeDisposal(e, fee);
      } else if (k === Kind.INCOME) {
        const { v, src } = this.valueEur(e);
        this.acquire(e, e.asset, e.qty, v);
        this.move(e, e.account, e.asset, e.qty, v);
        this.incomes.push({ uid: e.uid, ts: e.ts, day: taxDate(e.ts), year: CT.yearOf(taxDate(e.ts)), account: e.account, asset: e.asset, cls, qty: e.qty, value: v, type: e.incomeType || 'other', source: src, src: e.src });
      } else if (k === Kind.FEE) {
        const { v } = this.valueEur(e);
        this.move(e, e.account, e.asset, e.qty.neg(), v);
        this.dispose(e, e.uid, e.asset, e.qty, v, ZERO, 'fee', 'commissione');
      } else if (k === Kind.TRANSFER_OUT) this.transferOut(e, pair.get(e.uid));
      else if (k === Kind.TRANSFER_IN) this.transferIn(e, pair.get(e.uid));
    }

    transferOut(e, other) {
      if (other) {
        this.move(e, e.account, e.asset, e.qty.neg(), this.hint(e));
        const feeQty = e.qty.minus(other.qty);
        if (feeQty.gt(0)) {
          const fe = Object.assign({}, e, { kind: Kind.FEE, qty: feeQty, value: e.value !== null ? e.value.times(feeQty).div(e.qty) : null });
          const { v } = this.valueEur(fe);
          this.dispose(fe, e.uid + '#netfee', e.asset, feeQty, v, ZERO, 'transfer_fee', 'commissione di rete');
          this.move(e, '(rete)', e.asset, feeQty);
        }
        return;
      }
      const res = this.opts.resolutions[e.uid] || {};
      if (res.action === 'disposal') {
        const fe = Object.assign({}, e, { kind: Kind.SELL, value: D(res.value_eur), valueCcy: 'EUR' });
        const { v, src } = this.valueEur(fe);
        this.move(e, e.account, e.asset, e.qty.neg(), v);
        this.dispose(fe, e.uid, e.asset, e.qty, v, ZERO, 'sell', 'inserito da te', 'uscita trattata come vendita');
        this.issue('info', 'resolved_disposal', e.uid, 'Uscita trattata come vendita su tua indicazione');
        return;
      }
      const wallet = res.wallet || WALLET;
      this.move(e, e.account, e.asset, e.qty.neg(), this.hint(e));
      this.move(e, wallet, e.asset, e.qty, this.hint(e));
      if (res.action === 'self_custody') this.issue('info', 'resolved_self_custody', e.uid, `Uscita verso ${wallet}: nessuna vendita`);
      else this.issue('block', 'transfer_out_unmatched', e.uid,
        `Il ${taxDate(e.ts)} sono usciti ${CT.fq(e.qty)} ${e.asset} da ${e.account}, ma non risultano arrivati su un altro tuo conto.`,
        { asset: e.asset, qty: e.qty, day: taxDate(e.ts), account: e.account });
    }

    transferIn(e, other) {
      if (other) { this.move(e, e.account, e.asset, e.qty, this.hint(e) ?? this.hint(other)); return; }
      const res = this.opts.resolutions[e.uid] || {};
      if (res.action === 'from_self_custody') {
        const wallet = res.wallet || WALLET;
        this.move(e, wallet, e.asset, e.qty.neg(), this.hint(e));
        this.move(e, e.account, e.asset, e.qty, this.hint(e));
        this.issue('info', 'resolved_from_self_custody', e.uid, `Ingresso da ${wallet}: nessun nuovo acquisto`);
        return;
      }
      if (res.action === 'set_cost') {
        const when = res.acquired ? new Date(res.acquired + 'T00:00:00Z') : e.ts;
        this.acquire(e, e.asset, e.qty, D(res.cost_eur), true, when);
        this.move(e, e.account, e.asset, e.qty, null);
        this.issue('info', 'resolved_cost', e.uid, `Costo impostato manualmente: ${res.cost_eur} €`);
        return;
      }
      this.acquire(e, e.asset, e.qty, ZERO, false);
      this.move(e, e.account, e.asset, e.qty, this.hint(e));
      this.issue('block', 'transfer_in_unmatched', e.uid,
        `Il ${taxDate(e.ts)} sono arrivati ${CT.fq(e.qty)} ${e.asset} su ${e.account} da un'origine che non conosco.`,
        { asset: e.asset, qty: e.qty, day: taxDate(e.ts), account: e.account });
    }
  }

  CT.PriceBook = PriceBook; CT.Engine = Engine; CT.LotPool = LotPool; CT.WALLET = WALLET;
  if (typeof module !== 'undefined') module.exports = { PriceBook, Engine, LotPool };
})();

</script>
<script>
/* Imposta sostitutiva per anno e per paniere: cripto (art. 67 c.1 lett. c-sexies) e metalli preziosi (c-ter).
   Le regole sono marcate "da verificare": valori raccolti da fonti secondarie (vedi docs/SPECIFICA.md). */
(function () {
  'use strict';
  const CT = (globalThis.CT = globalThis.CT || {});
  const { D, ZERO, roundEuro, EMT_EUR } = CT;

  const BASE = { metalsRate: D('0.26'), ivcaRate: D('0.002'), lossYears: 4, status: 'da verificare' };
  const RULES = {
    2023: { ...BASE, year: 2023, cryptoRate: D('0.26'), threshold: D(2000), emtRate: null, note: 'Franchigia 2.000 € sulle plusvalenze cripto (se il totale supera 2.000 € si tassa tutto).' },
    2024: { ...BASE, year: 2024, cryptoRate: D('0.26'), threshold: D(2000), emtRate: null, note: 'Franchigia 2.000 € sulle plusvalenze cripto (se il totale supera 2.000 € si tassa tutto).' },
    2025: { ...BASE, year: 2025, cryptoRate: D('0.26'), threshold: null, emtRate: null, note: 'Aliquota 26%, nessuna franchigia (abolita dal 2025).' },
    2026: { ...BASE, year: 2026, cryptoRate: D('0.33'), threshold: null, emtRate: D('0.26'), note: 'Aliquota 33%; 26% per le stablecoin in euro conformi a MiCA (E-money token).' },
  };
  const YEARS = Object.keys(RULES).map(Number);

  function computeBasket(kind, year, rule, ds, incs, carry, useCarry) {
    const isCrypto = kind === 'crypto';
    const r = {
      kind, year, name: isCrypto ? 'Cripto-attività' : 'Oro e metalli preziosi',
      law: isCrypto ? 'art. 67, c. 1, lett. c-sexies TUIR' : 'art. 67, c. 1, lett. c-ter TUIR',
      rate: isCrypto ? rule.cryptoRate : rule.metalsRate,
      nDisposals: ds.length, proceeds: ZERO, costs: ZERO, gains: ZERO, losses: ZERO, net: ZERO, income: ZERO,
      carryUsed: [], carryUnused: [], carryExpired: [], newLoss: ZERO, taxable: ZERO, tax: ZERO, thresholdExempt: false, emtShare: ZERO,
    };
    for (const d of ds) {
      r.proceeds = r.proceeds.plus(d.proceeds); r.costs = r.costs.plus(d.cost);
      if (d.gain.gt(0)) r.gains = r.gains.plus(d.gain); else r.losses = r.losses.minus(d.gain);
    }
    r.income = incs.reduce((s, i) => s.plus(i.value), ZERO);
    r.net = r.gains.minus(r.losses);

    const usable = carry.filter((c) => c.year >= year - rule.lossYears && c.year < year).sort((a, b) => a.year - b.year);
    r.carryExpired = carry.filter((c) => c.year < year - rule.lossYears);

    let cap = r.net.gt(0) ? roundEuro(r.net) : ZERO;
    const exempt = isCrypto && rule.threshold && r.net.plus(r.income).lte(rule.threshold);
    if (exempt && (r.net.gt(0) || r.income.gt(0))) {
      r.thresholdExempt = true; cap = ZERO; r.carryUnused = usable.map((c) => ({ ...c }));
      r.taxable = ZERO; r.tax = ZERO;
    } else {
      for (const c of usable) {
        const take = useCarry ? (c.amount.lt(cap) ? c.amount : cap) : ZERO;
        if (take.gt(0)) { r.carryUsed.push({ year: c.year, amount: take }); cap = cap.minus(take); }
        if (c.amount.minus(take).gt(0)) r.carryUnused.push({ year: c.year, amount: c.amount.minus(take) });
      }
      r.taxable = roundEuro(cap.plus(r.income));
      let tax = r.taxable.times(r.rate);
      if (isCrypto && rule.emtRate) {
        const emtNet = ds.filter((d) => EMT_EUR.has(d.asset)).reduce((s, d) => s.plus(d.gain), ZERO);
        const share = emtNet.gt(0) ? (emtNet.lt(cap) ? emtNet : cap) : ZERO;
        r.emtShare = roundEuro(share);
        tax = r.taxable.minus(r.emtShare).times(r.rate).plus(r.emtShare.times(rule.emtRate));
      }
      r.tax = roundEuro(tax);
    }
    if (r.net.lt(0)) r.newLoss = roundEuro(r.net.neg());
    return r;
  }

  /** Calcola dal 2023 fino a `toYear` riportando automaticamente le minusvalenze (se useCarry). */
  function computeYears(engine, opts) {
    const { toYear, useCarry = true, manualCarry = {} } = opts;
    const carry = { crypto: (manualCarry.crypto || []).map((c) => ({ year: +c.year, amount: D(c.amount) })), metals: (manualCarry.metals || []).map((c) => ({ year: +c.year, amount: D(c.amount) })) };
    const out = {};
    for (const y of YEARS.filter((y) => y <= toYear)) {
      const rule = RULES[y];
      const ds = engine.disposals.filter((d) => d.year === y);
      const incs = engine.incomes.filter((i) => i.year === y);
      const crypto = computeBasket('crypto', y, rule, ds.filter((d) => d.cls === 'crypto'), incs.filter((i) => i.cls === 'crypto'), carry.crypto, useCarry);
      const metals = computeBasket('metal', y, rule, ds.filter((d) => d.cls === 'metal'), incs.filter((i) => i.cls === 'metal'), carry.metals, useCarry);
      if (crypto.newLoss.gt(0)) carry.crypto.push({ year: y, amount: crypto.newLoss });
      if (metals.newLoss.gt(0)) carry.metals.push({ year: y, amount: metals.newLoss });
      // le minusvalenze usate o scadute escono dalla lista (aggiornamento in sede di riporto)
      for (const [list, b] of [[carry.crypto, crypto], [carry.metals, metals]]) {
        for (const u of b.carryUsed) { const c = list.find((x) => x.year === u.year); if (c) c.amount = c.amount.minus(u.amount); }
        for (let i = list.length - 1; i >= 0; i--) if (list[i].amount.lte(0)) list.splice(i, 1);
      }
      out[y] = { year: y, rule, crypto, metals, totalTax: crypto.tax.plus(metals.tax) };
    }
    return out;
  }

  CT.tax = { RULES, YEARS, computeYears, computeBasket };
  if (typeof module !== 'undefined') module.exports = CT.tax;
})();

</script>
<script>
/* Prospetto per il monitoraggio (quadro RW) e IVCA: BOZZA DI LAVORO.
   Per ogni coppia (custode, asset): giorni di detenzione, valore iniziale/finale, IVCA indicativa.
   Mappatura su righi/codici e criterio di valorizzazione da verificare sulle istruzioni ufficiali dell'anno. */
(function () {
  'use strict';
  const CT = (globalThis.CT = globalThis.CT || {});
  const { D, ZERO } = CT;
  const DUST = D('1e-9');

  function addDays(day, n) { return new Date(Date.parse(day + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10); }
  function countDays(intervals, start, end) {
    const held = new Set();
    for (const [a, b] of intervals) {
      let x = a < start ? start : a; const stop = b > end ? end : b;
      while (x <= stop) { held.add(x); x = addDays(x, 1); }
    }
    return held.size;
  }

  function computeRW(engine, year, rule) {
    const start = `${year}-01-01`, end = `${year}-12-31`;
    const series = new Map();
    for (const m of engine.movements) {
      if (m.account === '(rete)') continue;
      const k = m.account + '\u0000' + m.asset;
      if (!series.has(k)) series.set(k, []);
      series.get(k).push(m);
    }
    const rows = [];
    for (const [k, moves] of [...series].sort((a, b) => (a[0] < b[0] ? -1 : 1))) {
      const [account, asset] = k.split('\u0000');
      moves.sort((a, b) => a.ts - b.ts);
      const cls = engine.cls(asset);
      let bal = ZERO, curStart = null, firstIn = null, lastOut = null;
      const intervals = [];
      for (const m of moves) {
        if (m.day > end) break;
        const before = bal; bal = bal.plus(m.delta);
        if (before.lte(DUST) && bal.gt(DUST)) { curStart = m.day; if (m.day >= start && firstIn === null) firstIn = { day: m.day, qty: bal, eur: m.eur }; }
        else if (before.gt(DUST) && bal.lte(DUST)) { intervals.push([curStart || m.day, m.day]); curStart = null; if (m.day >= start) lastOut = { day: m.day, qty: before, eur: m.eur }; }
      }
      // valore di un ingresso/uscita: importo dell'operazione se noto, altrimenti prezzo di mercato del giorno
      const notes = [];
      const valueAt = (pt) => {
        if (!pt) return null;
        if (pt.eur !== null && pt.eur !== undefined) return pt.eur;
        const p = engine.prices.get(asset, pt.day);
        if (p) return p.price.times(pt.qty);
        need(engine, asset, pt.day, account, notes, `prezzo del ${pt.day.split('-').reverse().join('/')}`);
        return null;
      };
      if (curStart !== null) intervals.push([curStart, end]);
      const qtyStart = moves.filter((m) => m.day < start).reduce((s, m) => s.plus(m.delta), ZERO);
      const qtyEnd = moves.filter((m) => m.day <= end).reduce((s, m) => s.plus(m.delta), ZERO);
      const days = countDays(intervals, start, end);
      if (days === 0 && qtyStart.lte(DUST)) continue;

      let v0, v1;
      if (qtyStart.gt(DUST)) {
        const p = engine.prices.get(asset, start);
        if (p) v0 = qtyStart.times(p.price);
        else { v0 = null; need(engine, asset, start, account, notes, 'prezzo al 1/1'); }
      } else v0 = valueAt(firstIn);
      if (qtyEnd.gt(DUST)) {
        const p = engine.prices.get(asset, end);
        if (p) v1 = qtyEnd.times(p.price);
        else { v1 = null; need(engine, asset, end, account, notes, 'prezzo al 31/12'); }
      } else v1 = valueAt(lastOut);
      let ivca = ZERO;
      if (cls === 'crypto' && v1 !== null && v1 !== undefined) ivca = rule.ivcaRate.times(v1).times(days).div(365);
      if (cls === 'metal') notes.push('metallo: IVCA/IVAFE non calcolate (verificare con il commercialista)');
      if (account === CT.WALLET || account.startsWith('Wallet')) notes.push('wallet personale: verificare obbligo e codice RW');
      rows.push({ account, asset, cls, qtyStart, qtyEnd, days, valueInitial: v0, valueFinal: v1, ivca, notes });
    }
    return rows;
  }

  function need(engine, asset, day, account, notes, label) {
    engine.missingPrices.set(`${asset.toUpperCase()}|${day}`, { symbol: asset.toUpperCase(), day });
    engine.issue('block', 'missing_price', '', `Per il prospetto RW serve il ${label} di ${asset} (${day})`, { symbol: asset.toUpperCase(), day, forRW: true });
    notes.push('manca ' + label);
  }

  CT.computeRW = computeRW;
  if (typeof module !== 'undefined') module.exports = { computeRW };
})();

</script>
<script>
/* Lettura di file .zip nel browser (l'export di Crypto.com Exchange e' uno zip con piu' CSV). Nessuna libreria:
   usa DecompressionStream('deflate-raw') disponibile nei browser moderni. */
(function () {
  'use strict';
  const CT = (globalThis.CT = globalThis.CT || {});

  async function inflateRaw(bytes) {
    const ds = new DecompressionStream('deflate-raw');
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }

  /** ArrayBuffer -> [{name, text}] (solo file di testo non vuoti, niente cartelle). */
  async function unzip(buf) {
    const u8 = new Uint8Array(buf);
    const dv = new DataView(buf);
    let eocd = -1;
    for (let i = u8.length - 22; i >= Math.max(0, u8.length - 65557); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('File ZIP non valido');
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const out = [];
    for (let n = 0; n < count; n++) {
      if (dv.getUint32(p, true) !== 0x02014b50) throw new Error('ZIP danneggiato');
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nlen));
      p += 46 + nlen + elen + clen;
      if (name.endsWith('/')) continue;
      const lnlen = dv.getUint16(lho + 26, true), lelen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lnlen + lelen;
      const raw = u8.subarray(start, start + csize);
      let data;
      if (method === 0) data = raw;
      else if (method === 8) data = await inflateRaw(raw);
      else throw new Error(`Compressione ZIP non supportata (${method}) in ${name}`);
      out.push({ name: name.split('/').pop(), text: new TextDecoder('utf-8').decode(data) });
    }
    return out;
  }

  CT.unzip = unzip;
  if (typeof module !== 'undefined') module.exports = { unzip };
})();

</script>
<script>
/* Dal contenuto dei file al risultato: unisce importazione, motore, imposta e RW. Usato dall'interfaccia. */
(function () {
  'use strict';
  const CT = (globalThis.CT = globalThis.CT || {});
  const { Kind, taxDate } = CT;

  const parseCache = new Map();

  function parseFile(f) {
    const key = `${f.id}|${f.type}|${f.account || ''}|${f.text.length}`;
    if (parseCache.has(key)) return parseCache.get(key);
    let out;
    try {
      const t = CT.importers.TYPES[f.type];
      if (!t) throw new Error('Tipo di file non selezionato');
      out = { file: f, ok: true, result: t.parse(f.text, f.name, f.account || undefined) };
    } catch (e) {
      out = { file: f, ok: false, error: e.message };
    }
    parseCache.set(key, out);
    return out;
  }

  function manualToEvents(manual) {
    if (!manual || !manual.length) return [];
    const head = CT.importers.GENERIC_HEADERS;
    const csv = head.join(';') + '\n' + manual.map((m) => head.map((h) => String(m[h] ?? '').replace(/;/g, ',')).join(';')).join('\n');
    return CT.importers.TYPES.generic.parse(csv, 'inserimento manuale').events;
  }

  function analyze(input) {
    const { files = [], manual = [], resolutions = {}, prices = {}, settings = {} } = input;
    const year = settings.year || 2025;
    const parsed = [];
    const events = [];
    const seen = new Set();
    let duplicates = 0;
    const all = files.filter((f) => !f.disabled).map(parseFile);
    for (const p of all) {
      parsed.push(p);
      if (!p.ok) continue;
      for (const e of p.result.events) {
        if (seen.has(e.uid)) { duplicates++; continue; }
        seen.add(e.uid);
        events.push(e);
      }
    }
    for (const e of manualToEvents(manual)) { if (!seen.has(e.uid)) { seen.add(e.uid); events.push(e); } }

    const pb = new CT.PriceBook();
    for (const [k, v] of Object.entries(prices)) { const [sym, day] = k.split('|'); if (v !== '' && v !== null) pb.setManual(sym, day, v); }
    const engine = new CT.Engine({ rebase2025: !!settings.rebase2025, resolutions, prices: pb }).run(events);
    if (duplicates) engine.issue('info', 'duplicates', '', `${duplicates} righe presenti in più file (periodi sovrapposti) sono state contate una sola volta.`);
    const years = CT.tax.computeYears(engine, { toYear: year, useCarry: settings.useCarry !== false });
    const y = years[year];
    const rw = CT.computeRW(engine, year, y.rule);
    return { year, parsed, events, engine, years, y, rw, groups: groupIssues(engine), balances: balancesAt(engine, `${year}-12-31`) };
  }

  /** Raggruppa i problemi per la schermata "Da controllare". */
  function groupIssues(engine) {
    const g = { transferOut: [], transferIn: [], history: [], unknown: new Map(), prices: new Map(), outOfScope: [], notes: [], blockCount: 0 };
    const seenPrice = new Set();
    for (const i of engine.issues) {
      if (i.level === 'block') {
        if (i.code === 'transfer_out_unmatched') g.transferOut.push(i);
        else if (i.code === 'transfer_in_unmatched') g.transferIn.push(i);
        else if (i.code === 'missing_history') g.history.push(i);
        else if (i.code === 'unrecognized_row') {
          const k = i.data.key || 'Riga non riconosciuta';
          if (!g.unknown.has(k)) g.unknown.set(k, { key: k, items: [] });
          g.unknown.get(k).items.push(i);
        } else if (i.code === 'missing_price' || i.code === 'missing_value') {
          const k = `${i.data.symbol}|${i.data.day}`;
          if (!seenPrice.has(k)) { seenPrice.add(k); g.prices.set(k, i); }
        } else g.notes.push(i);
      } else if (i.code === 'out_of_scope') g.outOfScope.push(i);
      else g.notes.push(i);
    }
    g.blockCount = g.transferOut.length + g.transferIn.length + g.history.length +
      [...g.unknown.values()].length + (g.prices.size ? 1 : 0) + g.notes.filter((i) => i.level === 'block').length;
    return g;
  }

  function balancesAt(engine, dayEnd) {
    const m = new Map();
    for (const mv of engine.movements) {
      if (mv.account === '(rete)' || mv.day > dayEnd) continue;
      const k = mv.account + '\u0000' + mv.asset;
      m.set(k, (m.get(k) || CT.ZERO).plus(mv.delta));
    }
    return [...m].map(([k, q]) => { const [account, asset] = k.split('\u0000'); return { account, asset, qty: q }; })
      .filter((b) => b.qty.abs().gt('1e-9')).sort((a, b) => (a.account + a.asset < b.account + b.asset ? -1 : 1));
  }

  CT.analyze = analyze;
  CT.groupIssues = groupIssues;
  if (typeof module !== 'undefined') module.exports = { analyze, groupIssues };
})();

</script>
<script>
/* Tabelle ed esportazioni: CSV per Excel italiano (; e virgola decimale), riepilogo testuale, report stampabile. */
(function () {
  'use strict';
  const CT = (globalThis.CT = globalThis.CT || {});
  const { D, ZERO, fx2, fq } = CT;

  const num = (x) => (x === null || x === undefined ? '' : fx2(x).replace('.', ','));
  const qnum = (x) => (x === null || x === undefined ? '' : fq(x).replace('.', ','));
  const dmy = (day) => (day ? day.split('-').reverse().join('/') : '');
  const KIND_IT = { sell: 'Vendita', swap: 'Permuta', spend: 'Pagamento', fee: 'Commissione', transfer_fee: 'Commissione di rete' };
  const CLS_IT = { crypto: 'Cripto', metal: 'Oro/metalli' };
  const INC_IT = { interest: 'Interessi', staking: 'Staking', cashback: 'Cashback', referral: 'Referral', airdrop: 'Airdrop', other: 'Altro' };

  function csv(headers, rows) {
    const esc = (v) => { const s = String(v ?? ''); return /[;"\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
    return '﻿' + [headers, ...rows].map((r) => r.map(esc).join(';')).join('\r\n') + '\r\n';
  }

  const disposalsRows = (res) => res.engine.disposals.filter((d) => d.year === res.year).sort((a, b) => a.ts - b.ts).map((d) =>
    [dmy(d.day), d.account, d.asset, CLS_IT[d.cls] || d.cls, KIND_IT[d.kind] || d.kind, qnum(d.qty), num(d.proceeds), num(d.fee), num(d.cost), num(d.gain), d.source, d.src]);
  const DISPOSAL_HEAD = ['Data', 'Conto', 'Asset', 'Categoria', 'Tipo', 'Quantità', 'Corrispettivo netto €', 'Commissioni €', 'Costo €', 'Plus/minusvalenza €', 'Fonte del valore', 'Origine nel file'];

  const lotsRows = (res) => res.engine.disposals.filter((d) => d.year === res.year).sort((a, b) => a.ts - b.ts).flatMap((d) =>
    d.uses.map((u) => [dmy(d.day), d.asset, qnum(d.qty), dmy(u.day), qnum(u.qty), num(u.cost), u.documented ? 'sì' : 'NO', u.rebased ? 'sì' : 'no', u.lotId]));
  const LOTS_HEAD = ['Data cessione', 'Asset', 'Quantità ceduta', 'Data acquisto lotto', 'Quantità dal lotto', 'Costo del lotto €', 'Costo documentato', 'Rideterminato 1/1/2025', 'Lotto'];

  const incomesRows = (res) => res.engine.incomes.filter((i) => i.year === res.year).sort((a, b) => a.ts - b.ts).map((i) =>
    [dmy(i.day), i.account, i.asset, CLS_IT[i.cls] || i.cls, INC_IT[i.type] || i.type, qnum(i.qty), num(i.value), i.source, i.src]);
  const INCOME_HEAD = ['Data', 'Conto', 'Asset', 'Categoria', 'Tipo', 'Quantità', 'Valore normale €', 'Fonte del valore', 'Origine nel file'];

  const rwRows = (res) => res.rw.map((r) => [r.account, r.asset, CLS_IT[r.cls] || r.cls, qnum(r.qtyStart), qnum(r.qtyEnd), r.days, num(r.valueInitial), num(r.valueFinal), num(r.ivca), r.notes.join('; ')]);
  const RW_HEAD = ['Custode', 'Asset', 'Categoria', 'Quantità al 1/1', 'Quantità al 31/12', 'Giorni di detenzione', 'Valore iniziale €', 'Valore finale €', 'IVCA indicativa €', 'Note'];

  const issuesRows = (res) => res.engine.issues.map((i) => [i.level === 'block' ? 'DA RISOLVERE' : i.level === 'warn' ? 'Attenzione' : 'Nota', i.code, i.message, i.uid]);
  const ISSUE_HEAD = ['Livello', 'Codice', 'Messaggio', 'Riferimento'];

  const balancesRows = (res) => res.balances.map((b) => [b.account, b.asset, qnum(b.qty)]);
  const BAL_HEAD = ['Conto', 'Asset', `Saldo al 31/12`];

  function basketLines(b) {
    const L = [];
    L.push([`${b.name} (${b.law})`, '']);
    L.push(['Corrispettivi delle cessioni (netto commissioni)', num(b.proceeds)]);
    L.push(['Costi di acquisto', num(b.costs)]);
    L.push(['Plusvalenze', num(b.gains)]);
    L.push(['Minusvalenze', num(b.losses)]);
    if (b.income.gt(0)) L.push(['Proventi (staking, interessi, ecc.)', num(b.income)]);
    for (const c of b.carryUsed) L.push([`Minusvalenza ${c.year} utilizzata`, num(c.amount)]);
    L.push(['Imponibile', num(b.taxable)]);
    L.push([`Imposta sostitutiva (${b.rate.times(100).toFixed(0)}%)`, num(b.tax)]);
    if (b.newLoss.gt(0)) L.push([`Minusvalenza ${b.year} da riportare`, num(b.newLoss)]);
    return L;
  }

  function summaryText(res) {
    const y = res.y, blk = res.groups.blockCount;
    const L = [];
    L.push(`RIEPILOGO FISCALE ${res.year} - cripto e metalli preziosi`);
    L.push(blk ? `*** BOZZA: ${blk} cose da risolvere prima di usare i numeri ***` : 'Nessun problema bloccante rilevato (serve comunque la revisione di un professionista).');
    L.push('');
    for (const b of [y.crypto, y.metals]) { for (const [a, v] of basketLines(b)) L.push(v === '' ? `\n${a}` : `  ${a}: ${v} €`); }
    L.push('', `IMPOSTA SOSTITUTIVA TOTALE STIMATA: ${num(y.totalTax)} €`);
    L.push('', `Regole ${res.year}: ${y.rule.note} (stato: ${y.rule.status})`);
    return L.join('\r\n');
  }

  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  function table(head, rows) {
    return `<table><thead><tr>${head.map((h) => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
  }
  /** Documento HTML autonomo, da aprire e stampare / salvare in PDF dal browser. */
  function reportHtml(res) {
    const y = res.y, blk = res.groups.blockCount;
    const sec = (b) => `<h2>${esc(b.name)}</h2><p class="law">${esc(b.law)}</p>` + table(['Voce', '€'], basketLines(b).slice(1));
    return `<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Riepilogo fiscale ${res.year}</title><style>
body{font:14px/1.5 system-ui,Segoe UI,Arial,sans-serif;max-width:860px;margin:2rem auto;padding:0 1rem;color:#14202b}
h1{font-size:1.5rem}h2{margin-top:2rem;font-size:1.15rem}.law{color:#5d6b7a;margin-top:-.6rem}
table{border-collapse:collapse;width:100%;margin:.5rem 0}th,td{border-bottom:1px solid #dfe4ea;padding:.35rem .5rem;text-align:left;vertical-align:top}
td:last-child,th:last-child{text-align:right}.tot{font-size:1.2rem;font-weight:600;margin:1rem 0}
.warn{background:#fff3d6;border:1px solid #e0b252;padding:.6rem .8rem;border-radius:6px}small{color:#5d6b7a}
@media print{body{margin:0}h2{break-after:avoid}tr{break-inside:avoid}}</style></head><body>
<h1>Riepilogo fiscale ${res.year}</h1>
${blk ? `<p class="warn"><b>BOZZA</b>: ${blk} punti da risolvere prima di usare questi numeri.</p>` : ''}
${sec(y.crypto)}${sec(y.metals)}
<p class="tot">Imposta sostitutiva totale stimata: ${esc(num(y.totalTax))} €</p>
<h2>Monitoraggio (quadro RW) - bozza</h2>
${table(['Custode', 'Asset', 'Giorni', 'Valore iniziale €', 'Valore finale €', 'IVCA indicativa €'], res.rw.map((r) => [r.account, r.asset, r.days, num(r.valueInitial), num(r.valueFinal), num(r.ivca)]))}
<h2>Cessioni dell'anno</h2>${table(DISPOSAL_HEAD.slice(0, 10), disposalsRows(res).map((r) => r.slice(0, 10)))}
<h2>Proventi dell'anno</h2>${table(INCOME_HEAD.slice(0, 7), incomesRows(res).map((r) => r.slice(0, 7)))}
<p><small>Regole ${res.year}: ${esc(y.rule.note)} Stato regole: ${esc(y.rule.status)}. Calcolo automatico: far verificare da un professionista prima dell'uso in dichiarazione.</small></p>
</body></html>`;
  }

  /** Diagnostica: SOLO struttura dei file e conteggi, nessun importo. Da incollare a chi sviluppa l'app. */
  function diagnostics(res, files) {
    const L = ['DIAGNOSTICA (nessun importo)', ''];
    for (const f of files) {
      L.push(`File: ${f.name} | tipo scelto: ${f.type || 'nessuno'}`);
      const d = CT.importers.describeFile(f.text);
      if (d.error) { L.push(`  errore: ${d.error}`); continue; }
      L.push(`  righe dati: ${d.rows} | riga intestazione: ${d.headerLine}`);
      L.push(`  colonne: ${d.headers.join(' | ')}`);
      for (const [k, vals] of Object.entries(d.categorical)) L.push(`  [${k}] ${vals.map(([v, n]) => `${v || '(vuoto)'}×${n}`).join(', ')}`);
    }
    L.push('', 'Problemi per tipo:');
    const c = {};
    for (const i of res.engine.issues) c[`${i.level}:${i.code}`] = (c[`${i.level}:${i.code}`] || 0) + 1;
    for (const [k, n] of Object.entries(c)) L.push(`  ${k}: ${n}`);
    for (const g of res.groups.unknown.values()) L.push(`  non riconosciuto: ${g.key} ×${g.items.length}`);
    return L.join('\n');
  }

  CT.report = { csv, num, qnum, dmy, disposalsRows, DISPOSAL_HEAD, lotsRows, LOTS_HEAD, incomesRows, INCOME_HEAD, rwRows, RW_HEAD,
    issuesRows, ISSUE_HEAD, balancesRows, BAL_HEAD, basketLines, summaryText, reportHtml, diagnostics, KIND_IT, CLS_IT, INC_IT };
  if (typeof module !== 'undefined') module.exports = CT.report;
})();

</script>
<script>
/* Interfaccia. Nessun innerHTML con dati dell'utente: tutto passa da textContent (i file possono contenere testo qualsiasi). */
(function () {
  'use strict';
  const CT = globalThis.CT;
  const { D } = CT;
  const R = CT.report;

  // ------------------------------------------------------------------ utilita'
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'class') el.className = v;
        else if (k === 'for') el.htmlFor = v;
        else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
        else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'hidden' || k === 'multiple') el[k] = v;
        else el.setAttribute(k, v === true ? '' : v);
      }
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid === null || kid === undefined || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const eurFmt = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' });
  const money = (x) => (x === null || x === undefined ? '—' : eurFmt.format(Number(D(x).toFixed(2))));
  const qty = (x) => (x === null || x === undefined ? '—' : CT.fq(x).replace('.', ','));
  const dmy = R.dmy;
  const pct = (x) => `${D(x).times(100).toFixed(0)}%`;
  const uid = () => Math.random().toString(36).slice(2, 9);

  // ------------------------------------------------------------------ stato e salvataggio
  const state = { files: [], manual: [], resolutions: {}, prices: {}, settings: { year: 2025, rebase2025: false, useCarry: true }, example: false };
  const ui = { tab: 'files', res: null, error: null, detail: 'cessioni', filter: '', confirmReset: false, toast: '', busy: '' };

  function idb() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('dichiarazione-crypto', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  }
  async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); }
  let saveTimer;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => { try { idbSet('state', JSON.parse(JSON.stringify(state))).catch(() => {}); } catch (e) { /* archiviazione non disponibile */ } }, 250);
  }
  async function load() {
    try {
      const s = await idbGet('state');
      if (s && Array.isArray(s.files)) Object.assign(state, s, { settings: Object.assign(state.settings, s.settings || {}) });
    } catch (e) { /* archiviazione non disponibile: si parte da zero */ }
  }

  function recompute() {
    try { ui.res = CT.analyze(state); ui.error = null; } catch (e) { console.error(e); ui.res = null; ui.error = e; }
  }
  function changed(nextTab) {
    recompute(); save();
    if (nextTab) ui.tab = nextTab;
    render();
  }
  function toast(msg) {
    ui.toast = msg; render();
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { ui.toast = ''; const el = document.querySelector('.toast'); if (el) el.remove(); }, 3500);
  }
  function resolve(uidKey, resolution, msg) { state.resolutions[uidKey] = resolution; changed(); toast(msg || 'Fatto'); }

  // ------------------------------------------------------------------ salvataggio file (esportazione)
  async function saveFile(name, data, mime) {
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename: name, data }); toast(`Salvato: ${name}`); return; }
    } catch (e) {
      if (e && e.code === 'declined') return;
    }
    try {
      const blob = new Blob([data], { type: mime || 'text/plain' });
      const a = h('a', { href: URL.createObjectURL(blob), download: name });
      document.body.append(a); a.click(); a.remove();
      toast(`Scaricato: ${name}`);
    } catch (e) { toast('Salvataggio non riuscito: usa il pulsante Copia'); }
  }
  async function copyText(text, label) {
    try { await navigator.clipboard.writeText(text); toast(`${label || 'Testo'} copiato negli appunti`); }
    catch (e) {
      const ta = h('textarea', { class: 'sr' }, text); document.body.append(ta); ta.select();
      try { document.execCommand('copy'); toast(`${label || 'Testo'} copiato negli appunti`); } catch (e2) { toast('Copia non riuscita'); }
      ta.remove();
    }
  }

  // ------------------------------------------------------------------ file
  const EXAMPLE_APP = `Timestamp (UTC),Transaction Description,Currency,Amount,To Currency,To Amount,Native Currency,Native Amount,Native Amount (in USD),Transaction Kind
2025-01-10 10:00:00,Buy BTC,EUR,-1000,BTC,0.01,EUR,1000,1100,viban_purchase
2025-02-01 10:00:00,BTC -> ETH,BTC,-0.01,ETH,0.2,EUR,1200,1300,crypto_exchange
2025-03-01 10:00:00,Sell ETH,ETH,-0.2,EUR,1300,EUR,1300,1400,crypto_viban_exchange
2025-03-05 10:00:00,Earn,CRO,5,,,EUR,0.5,0.55,crypto_earn_interest_paid
2025-03-07 10:00:00,To exchange,CRO,-5,,,EUR,0.5,0.55,crypto_to_exchange_transfer
2025-03-08 10:00:00,Tipo di esempio non gestito,CRO,1,,,EUR,0.1,0.11,tipo_sconosciuto_esempio
`;
  const EXAMPLE_BP = `Transaction ID,Timestamp,Transaction Type,In/Out,Amount Fiat,Fiat,Amount Asset,Asset,Asset market price,Asset market price currency,Asset class,Product ID,Fee,Fee asset,Spread,Spread Currency
E1,2025-01-05T09:05:00+01:00,buy,incoming,500.00,EUR,10.0,XAU,50,EUR,Metal,,5.00,EUR,0,EUR
E2,2025-03-05T09:05:00+01:00,sell,outgoing,350.00,EUR,5.0,XAU,70,EUR,Metal,,3.00,EUR,0,EUR
`;

  function addFileText(name, text) {
    if (state.files.some((f) => f.name === name && f.text === text)) return false;
    state.files.push({ id: uid(), name, text, type: CT.importers.detectType(text) || '', account: '' });
    return true;
  }
  async function addFiles(list) {
    let added = 0, failed = [];
    for (const f of Array.from(list)) {
      try {
        if (/\.zip$/i.test(f.name)) {
          for (const z of await CT.unzip(await f.arrayBuffer())) if (/\.(csv|txt)$/i.test(z.name) && addFileText(z.name, z.text)) added++;
        } else if (addFileText(f.name, await f.text())) added++;
      } catch (e) { failed.push(f.name); }
    }
    const was = ui.tab;
    changed();
    if (was === 'files' && added) { ui.tab = ui.res && ui.res.groups.blockCount ? 'checks' : 'result'; render(); }
    toast(added ? `${added} file aggiunti` : failed.length ? `Non riesco a leggere: ${failed.join(', ')}` : 'File già caricati');
  }
  function loadExample() {
    addFileText('ESEMPIO-crypto.com-app.csv', EXAMPLE_APP);
    addFileText('ESEMPIO-bitpanda.csv', EXAMPLE_BP);
    state.example = true;
    changed('checks');
  }

  // ------------------------------------------------------------------ pannello: File
  function panelFiles() {
    const res = ui.res;
    const nodes = [];
    const input = h('input', { type: 'file', id: 'fileInput', multiple: true, accept: '.csv,.txt,.zip', class: 'sr', onchange: (e) => { addFiles(e.target.files); e.target.value = ''; } });
    const drop = h('label', { class: 'drop', for: 'fileInput' },
      h('strong', null, 'Trascina qui i tuoi file'),
      h('span', { class: 'muted' }, 'CSV di Crypto.com e Bitpanda, oppure direttamente lo .zip scaricato. Puoi caricarne quanti vuoi, anche di anni diversi.'),
      h('span', { class: 'btn primary' }, 'Scegli i file'), input);
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); if (e.dataTransfer && e.dataTransfer.files.length) addFiles(e.dataTransfer.files); });
    nodes.push(h('p', { class: 'muted small' }, 'I file restano nel tuo browser e non vengono inviati a nessuno.'));
    nodes.push(drop);

    if (!state.files.length) {
      nodes.push(h('div', { class: 'card empty' },
        h('h2', null, 'Nessun file caricato'),
        h('p', { class: 'muted' }, 'Carica gli export delle tue piattaforme, poi scegli l\'anno in alto a destra. Vuoi prima vedere come funziona?'),
        h('button', { class: 'btn', onclick: loadExample }, 'Carica un esempio')));
    } else {
      const parsed = res ? res.parsed : [];
      nodes.push(h('div', { class: 'card' },
        h('div', { class: 'row between' }, h('h2', null, `File caricati (${state.files.length})`), state.example ? h('span', { class: 'example' }, 'CONTIENE DATI DI ESEMPIO') : null),
        state.files.map((f) => fileRow(f, parsed.find((p) => p.file.id === f.id)))));
    }
    nodes.push(manualCard());
    nodes.push(optionsCard());
    nodes.push(helpCard());
    nodes.push(h('div', { class: 'row' },
      ui.confirmReset
        ? [h('span', { class: 'small' }, 'Cancellare tutti i file, le scelte e i prezzi?'),
          h('button', { class: 'btn danger', onclick: () => { state.files = []; state.manual = []; state.resolutions = {}; state.prices = {}; state.example = false; ui.confirmReset = false; changed('files'); toast('Dati cancellati'); } }, 'Sì, cancella tutto'),
          h('button', { class: 'btn', onclick: () => { ui.confirmReset = false; render(); } }, 'Annulla')]
        : h('button', { class: 'btn quiet danger', onclick: () => { ui.confirmReset = true; render(); } }, 'Cancella tutti i dati salvati')));
    return h('div', { class: 'stack' }, nodes);
  }

  function fileRow(f, p) {
    const meta = [];
    let chip;
    if (!p) chip = h('span', { class: 'pill idle' }, '…');
    else if (!p.ok) chip = h('span', { class: 'pill bad' }, p.error);
    else {
      const r = p.result;
      meta.push(h('span', null, `${r.rows} righe`));
      if (r.from) meta.push(h('span', null, `dal ${dmy(CT.taxDate(r.from))} al ${dmy(CT.taxDate(r.to))}`));
      const unk = r.unknown.reduce((s, u) => s + u.count, 0);
      chip = unk ? h('span', { class: 'pill warn' }, `${unk} righe da controllare`) : h('span', { class: 'pill good' }, 'Letto correttamente');
    }
    const sel = h('select', { 'aria-label': `Tipo di file per ${f.name}`, onchange: (e) => { f.type = e.target.value; changed(); } },
      h('option', { value: '' }, 'Scegli il tipo di file…'),
      Object.entries(CT.importers.TYPES).map(([k, t]) => h('option', { value: k, selected: f.type === k }, t.label)));
    return h('div', { class: 'file' },
      h('div', null, h('div', { class: 'name' }, f.name), h('div', { class: 'meta' }, meta), h('div', { class: 'row', style: 'margin-top:8px' }, sel, chip)),
      h('button', { class: 'btn quiet danger', onclick: () => { state.files = state.files.filter((x) => x.id !== f.id); changed(); } }, 'Rimuovi'));
  }

  function manualCard() {
    const F = (label, attrs) => { const input = attrs.options ? h('select', { id: attrs.id }, attrs.options.map(([v, t]) => h('option', { value: v }, t))) : h('input', Object.assign({ type: 'text' }, attrs)); return { input, el: h('label', { class: 'field' }, h('span', null, label), input) }; };
    const date = F('Data', { id: 'm_date', type: 'date', value: `${state.settings.year}-06-30` });
    const tipo = F('Operazione', { id: 'm_tipo', options: [['acquisto', 'Acquisto'], ['vendita', 'Vendita'], ['permuta', 'Scambio tra due asset'], ['provento', 'Provento (staking, interessi…)'], ['pagamento', 'Pagamento con crypto'], ['trasferimento_uscita', 'Trasferimento in uscita'], ['trasferimento_entrata', 'Trasferimento in entrata']] });
    const conto = F('Conto o wallet', { id: 'm_conto', value: 'Wallet personale' });
    const asset = F('Asset (es. BTC)', { id: 'm_asset', placeholder: 'BTC' });
    const q = F('Quantità', { id: 'm_q', placeholder: '0,5' });
    const val = F('Valore in € (se lo conosci)', { id: 'm_v', placeholder: '1500' });
    const asset2 = F('Solo scambi: asset ricevuto', { id: 'm_a2', placeholder: 'ETH' });
    const q2 = F('Solo scambi: quantità ricevuta', { id: 'm_q2', placeholder: '2' });
    const tp = F('Solo proventi: tipo', { id: 'm_tp', options: [['staking', 'Staking'], ['interest', 'Interessi'], ['airdrop', 'Airdrop'], ['cashback', 'Cashback'], ['other', 'Altro']] });
    const add = () => {
      if (!asset.input.value.trim() || !q.input.value.trim() || !date.input.value) { toast('Compila almeno data, asset e quantità'); return; }
      state.manual.push({ id: uid(), data: `${date.input.value} 12:00`, tipo: tipo.input.value, conto: conto.input.value, asset: asset.input.value, quantita: q.input.value, valore_eur: val.input.value,
        asset_ricevuto: asset2.input.value, quantita_ricevuta: q2.input.value, tipo_provento: tp.input.value });
      changed(); toast('Operazione aggiunta');
    };
    return h('details', { class: 'card', open: state.manual.length > 0 || null },
      h('summary', null, 'Wallet personali, altre piattaforme o operazioni mancanti'),
      h('p', { class: 'muted small' }, 'Per i wallet che non hanno un export, per piattaforme non ancora supportate o per un acquisto che non compare nei file: inserisci le operazioni a mano oppure carica un file con il modello universale.'),
      h('div', { class: 'fields' }, date.el, tipo.el, conto.el, asset.el, q.el, val.el, asset2.el, q2.el, tp.el),
      h('div', { class: 'row' },
        h('button', { class: 'btn primary', onclick: add }, 'Aggiungi operazione'),
        h('button', { class: 'btn', onclick: () => saveFile('modello-universale.csv', '﻿' + CT.importers.GENERIC_TEMPLATE, 'text/csv') }, 'Scarica il modello CSV')),
      state.manual.length ? h('div', { class: 'tbl-wrap' }, h('table', null,
        h('thead', null, h('tr', null, ['Data', 'Operazione', 'Conto', 'Asset', 'Quantità', 'Valore €', ''].map((x) => h('th', null, x)))),
        h('tbody', null, state.manual.map((m) => h('tr', null, h('td', null, dmy(m.data.slice(0, 10))), h('td', null, m.tipo.replace('_', ' ')), h('td', null, m.conto), h('td', null, m.asset),
          h('td', { class: 'num' }, m.quantita), h('td', { class: 'num' }, m.valore_eur), h('td', null, h('button', { class: 'btn quiet danger', onclick: () => { state.manual = state.manual.filter((x) => x.id !== m.id); changed(); } }, 'Elimina'))))))) : null);
  }

  function optionsCard() {
    const s = state.settings;
    const check = (id, key, title, hint) => h('div', { class: 'check' },
      h('input', { type: 'checkbox', id, checked: !!s[key], onchange: (e) => { s[key] = e.target.checked; changed(); } }),
      h('label', { for: id }, h('strong', null, title)), h('span', { class: 'hint muted small' }, hint));
    return h('div', { class: 'card' }, h('h2', null, 'Opzioni di calcolo'),
      check('o_carry', 'useCarry', 'Riporta le minusvalenze degli anni precedenti', 'Le perdite che emergono dai tuoi file (dal 2023) riducono le tasse degli anni successivi, entro 4 anni. Calcolate in automatico: non serve sapere cosa hai dichiarato.'),
      check('o_rebase', 'rebase2025', 'Ho rideterminato il costo al 1° gennaio 2025', 'Facoltativo e raro: pagando un\'imposta del 18% sul valore delle cripto possedute il 1/1/2025, quel valore diventa il nuovo costo di acquisto. Se non sai di cosa si tratta lascia spento: vuol dire che non l\'hai fatto.'));
  }

  function helpCard() {
    return h('details', { class: 'card' }, h('summary', null, 'Dove trovo i file da caricare?'),
      h('ul', { class: 'clean muted' },
        h('li', null, h('strong', null, 'Crypto.com App: '), 'nell\'app vai in Contabilità → Cronologia transazioni → Esporta (CSV). Scarica un file per ogni periodo se te lo chiede.'),
        h('li', null, h('strong', null, 'Crypto.com Exchange: '), 'dal sito, sezione Ordini/Cronologia → Esporta. Ricevi uno .zip: puoi caricarlo così com\'è. Servono anche i file di depositi e prelievi.'),
        h('li', null, h('strong', null, 'Bitpanda: '), 'dal profilo, Cronologia transazioni → Scarica/Esporta (CSV). Per l\'oro scarica tutto lo storico.'),
        h('li', null, 'I nomi dei menu possono cambiare. Scarica sempre lo storico completo dall\'apertura del conto: servono anche gli anni passati per calcolare il costo di acquisto.')));
  }

  // ------------------------------------------------------------------ pannello: Da controllare
  function field(label, attrs) { const input = h('input', Object.assign({ type: 'text' }, attrs)); return { input, el: h('label', { class: 'field' }, h('span', null, label), input) }; }

  function issueCard(tone, title, body, ...rest) {
    return h('div', { class: `card tone-${tone}` }, h('h3', null, title), body ? h('p', { class: 'muted' }, body) : null, ...rest);
  }
  function needNumber(v, what) {
    const t = String(v).trim().replace(',', '.');
    if (!t || Number.isNaN(Number(t)) || Number(t) < 0) { toast(`Inserisci ${what} (un numero, es. 1500)`); return null; }
    return t;
  }

  function panelChecks() {
    const res = ui.res;
    if (!res) return noData();
    const g = res.groups;
    const out = [];
    if (!g.blockCount) out.push(h('div', { class: 'card tone-good' }, h('h2', null, 'Tutto a posto'), h('p', { class: 'muted' }, 'Non ci sono punti da risolvere. Controlla comunque i saldi finali nella scheda Dettaglio e confrontali con quelli che vedi nelle piattaforme.')));

  // ------------------------------------------------------------------ pannello: Prezzi
  async function fetchPrice(sym, day) {
    const ts = Math.floor(Date.parse(day + 'T23:59:59Z') / 1000);
    const r = await fetch(`https://min-api.cryptocompare.com/data/v2/histoday?fsym=${encodeURIComponent(sym)}&tsym=EUR&limit=1&toTs=${ts}`);
    const j = await r.json();
    const row = j && j.Data && j.Data.Data && j.Data.Data.find((x) => new Date(x.time * 1000).toISOString().slice(0, 10) === day);
    if (!row || !row.close) throw new Error('prezzo non disponibile');
    return String(row.close);
  }
  function panelPrices() {
    const res = ui.res;
    if (!res) return noData();

    const inputs = new Map();
    const rows = need.map((n) => {
      const key = `${n.symbol}|${n.day}`;
      const sug = res.engine.prices.nearest(n.symbol, n.day);
      const input = h('input', { type: 'text', 'aria-label': `Prezzo ${n.symbol} ${n.day}`, placeholder: '€ per 1 ' + n.symbol, id: `p_${key}`, style: 'width:140px' });
      inputs.set(key, input);
      return h('tr', null, h('td', null, n.symbol), h('td', null, dmy(n.day)),
        h('td', { class: 'muted small' }, sug ? h('span', null, `${money(sug.price)} (${dmy(sug.day)}, ${sug.daysApart} gg ${sug.daysApart === 1 ? 'prima/dopo' : 'di distanza'}) `, h('button', { class: 'btn quiet', onclick: () => { input.value = sug.price.toDecimalPlaces(8).toString(); } }, 'Usa')) : 'nessun prezzo noto'),
        h('td', null, input));
    });
    const saveAll = () => {
      let n = 0;
      for (const [k, input] of inputs) { const v = input.value.trim().replace(',', '.'); if (v && !Number.isNaN(Number(v)) && Number(v) > 0) { state.prices[k] = v; n++; } }
      if (!n) { toast('Scrivi almeno un prezzo valido'); return; }
      changed(); toast(`${n} prezzi salvati`);
    };
    const auto = async () => {
      ui.busy = 'Scarico i prezzi…'; render();
      let ok = 0, ko = 0;
      for (const n of need) {
        if (CT.classify(n.symbol) !== 'crypto') { ko++; continue; }
        try { state.prices[`${n.symbol}|${n.day}`] = await fetchPrice(n.symbol, n.day); ok++; } catch (e) { ko++; }
      }
      ui.busy = ''; changed(); toast(`${ok} prezzi scaricati${ko ? `, ${ko} da inserire a mano` : ''}`);
    };
    const have = Object.entries(state.prices);

        h('p', { class: 'muted' }, 'Il programma usa già i prezzi che ricava dalle tue operazioni dello stesso giorno. Per gli altri casi serve il prezzo in euro (chiusura giornaliera). Per l\'oro scrivi il prezzo di 1 grammo.'),
        need.length ? [h('div', { class: 'tbl-wrap' }, h('table', null, h('thead', null, h('tr', null, ['Asset', 'Data', 'Suggerimento', 'Prezzo in €'].map((x) => h('th', null, x)))), h('tbody', null, rows))),
          h('div', { class: 'row' }, h('button', { class: 'btn primary', onclick: saveAll }, 'Salva i prezzi'),
            h('button', { class: 'btn', disabled: !!ui.busy, onclick: auto }, ui.busy || 'Scarica i prezzi in automatico'),
            h('span', { class: 'muted small' }, 'Il download automatico (CryptoCompare) invia solo simbolo e data. Potrebbe non funzionare in tutte le versioni dell\'app.'))] : null),
      have.length ? h('div', { class: 'card' }, h('h3', null, `Prezzi inseriti (${have.length})`),

        item('Report completo', 'Documento da aprire nel browser e stampare o salvare in PDF', `riepilogo-${y}.html`, () => R.reportHtml(res), 'text/html'),
        item('Riepilogo', 'Testo con i totali per quadro', `riepilogo-${y}.txt`, () => R.summaryText(res), 'text/plain'),
        item('Vendite e scambi', 'Una riga per ogni cessione, con il costo e il guadagno', `cessioni-${y}.csv`, () => R.csv(R.DISPOSAL_HEAD, R.disposalsRows(res)), 'text/csv'),
        item('Dettaglio lotti', 'Per ogni cessione, i lotti di acquisto usati (utile in caso di controllo)', `lotti-${y}.csv`, () => R.csv(R.LOTS_HEAD, R.lotsRows(res)), 'text/csv'),
        item('Proventi', 'Staking, interessi, premi ricevuti nell\'anno', `proventi-${y}.csv`, () => R.csv(R.INCOME_HEAD, R.incomesRows(res)), 'text/csv'),
        item('Prospetto RW', 'Valori iniziali e finali, giorni e IVCA indicativa', `rw-${y}.csv`, () => R.csv(R.RW_HEAD, R.rwRows(res)), 'text/csv'),
        item('Saldi al 31/12', 'Quanto risulta in ogni conto a fine anno', `saldi-${y}.csv`, () => R.csv(R.BAL_HEAD, R.balancesRows(res)), 'text/csv'),
        item('Problemi e note', 'Tutto quello che il programma ha segnalato', `problemi-${y}.csv`, () => R.csv(R.ISSUE_HEAD, R.issuesRows(res)), 'text/csv')),
      h('div', { class: 'card' }, h('h2', null, 'Salvataggio del lavoro'),
        h('p', { class: 'muted small' }, 'Il lavoro si salva da solo in questo browser. Per fare una copia o spostarlo su un altro computer salva il progetto e ricaricalo da qui.'),
        h('div', { class: 'row' },
          h('button', { class: 'btn', onclick: () => saveFile('progetto-dichiarazione-crypto.json', JSON.stringify(state), 'application/json') }, 'Salva il progetto'),
          h('label', { class: 'btn', for: 'projIn' }, 'Apri un progetto salvato', h('input', { type: 'file', id: 'projIn', accept: '.json', class: 'sr', onchange: async (e) => {
            try { const s = JSON.parse(await e.target.files[0].text()); if (!Array.isArray(s.files)) throw new Error(); Object.assign(state, s); changed('result'); toast('Progetto caricato'); } catch (err) { toast('Il file non è un progetto valido'); }
          } })),
          h('button', { class: 'btn', onclick: () => copyText(R.diagnostics(res, state.files), 'Diagnostica') }, 'Copia diagnostica (senza importi)'))));
  }

  function noData() {
    return h('div', { class: 'stack' }, h('div', { class: 'card empty' }, h('h2', null, 'Prima carica i tuoi file'), h('p', { class: 'muted' }, ui.error ? `Errore: ${ui.error.message}` : 'Qui comparirà il risultato appena carichi gli export delle piattaforme.'),
      h('button', { class: 'btn primary', onclick: () => { ui.tab = 'files'; render(); } }, 'Vai ai file')));
  }

  // ------------------------------------------------------------------ cornice
  const TABS = [['files', 'File'], ['checks', 'Da controllare'], ['result', 'Risultato'], ['detail', 'Dettaglio'], ['prices', 'Prezzi'], ['export', 'Esporta']];
  function render() {
    const root = document.getElementById('app');
    const res = ui.res;
    const blk = res ? res.groups.blockCount : 0;
    const missing = res ? res.engine.missingPrices.size : 0;
    const hasData = state.files.length || state.manual.length;
    const status = !hasData ? h('span', { class: 'pill idle' }, 'Nessun dato')
      : blk ? h('button', { class: 'pill warn', onclick: () => { ui.tab = 'checks'; render(); } }, `Bozza · ${blk} da controllare`) : h('span', { class: 'pill good' }, 'Pronto');
    const yearSel = h('select', { id: 'yearSel', 'aria-label': 'Anno d\'imposta', onchange: (e) => { state.settings.year = +e.target.value; changed(); } },
      CT.tax.YEARS.map((y) => h('option', { value: y, selected: state.settings.year === y }, y)));
    const nav = h('nav', { class: 'nav', role: 'tablist' }, TABS.map(([k, t], i) => h('button', { class: 'tab', role: 'tab', 'aria-selected': ui.tab === k ? 'true' : 'false', onclick: () => { ui.tab = k; render(); window.scrollTo(0, 0); } },
      h('span', { class: 'n' }, i + 1), t,
      k === 'checks' && blk ? h('span', { class: 'badge' }, blk) : null, k === 'prices' && missing ? h('span', { class: 'badge' }, missing) : null)));
    const panel = { files: panelFiles, checks: panelChecks, result: panelResult, detail: panelDetail, prices: panelPrices, export: panelExport }[ui.tab]();
    const scrollY = window.scrollY;
    root.replaceChildren(...[
      h('header', { class: 'top' }, h('div', { class: 'wrap' },
        h('div', { class: 'top-in' }, h('div', null, h('div', { class: 'brand-name' }, 'Dichiarazione Crypto'), h('div', { class: 'brand-sub' }, 'Cripto e oro · redditi diversi · quadri RT e RW')),
          h('div', { class: 'top-ctl' }, h('label', { class: 'lbl', for: 'yearSel' }, 'Anno d\'imposta'), yearSel, status)), nav)),
      h('main', { class: 'wrap', id: 'main' }, panel),
      ui.toast ? h('div', { class: 'toast', role: 'status' }, ui.toast) : null].filter(Boolean));
    window.scrollTo(0, scrollY);
  }

  async function start() {
    await load();
    recompute();
    if (state.files.length && ui.res) ui.tab = ui.res.groups.blockCount ? 'checks' : 'result';
    render();
  }
  CT.app = { state, ui, render, start, recompute, addFileText, changed };
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
  }
})();

</script>
