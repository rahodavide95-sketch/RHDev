name: Database Documenti Raho

# Prepara su Supabase (progetto di Label Finance) le tabelle documenti_raho_* per la sincronizzazione
# cifrata di Documenti Raho. Usa lo stesso secret SUPABASE_ACCESS_TOKEN delle funzioni di Label Finance.
# Lo script SQL si può rieseguire: crea solo ciò che manca e non tocca Label Finance.
on:
  push:
    branches: [main]
    paths:
      - 'documenti-raho/supabase/schema.sql'
      - '.github/workflows/documenti-raho-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documenti-raho-db
  cancel-in-progress: false

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ztjlqorvnulgfvbtvavm
    steps:
      - uses: actions/checkout@v4

      - name: Controlla il token di Supabase
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Manca il secret SUPABASE_ACCESS_TOKEN: tabelle NON create. Incolla documenti-raho/supabase/schema.sql nel SQL Editor di Supabase."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Applica lo schema
        if: steps.token.outputs.skip != '1'
        run: |
          jq -Rs '{query: .}' documenti-raho/supabase/schema.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          echo "Risposta $code"; head -c 2000 /tmp/out.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 1; fi
