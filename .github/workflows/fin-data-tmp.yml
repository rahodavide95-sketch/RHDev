# TEMPORANEO (giro 2): raccoglie dati per finlandia/ e li salva in ci-out/ su questo ramo. Da rimuovere prima del merge.
name: Finlandia dati (temporaneo)
on:
  push:
    branches: [claude/sharp-pascal-md1r5s]
    paths: ['.github/workflows/fin-data-tmp.yml', 'ci-tmp/**']
permissions:
  contents: write
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pypdf
      - name: Dati (geo, percorsi, bus, clima)
        run: python3 ci-tmp/fetch_data.py
      - name: Salva i risultati sul ramo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ci-out
          git commit -m "ci: dati raccolti per finlandia (temporaneo)" || echo "niente da salvare"
          git pull --rebase origin claude/sharp-pascal-md1r5s
          git push
