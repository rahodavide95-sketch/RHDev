name: Prova quotazioni (temporanea)
on:
  push:
    branches: [claude/diag-quotes]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Codice vero dell'app contro onvista
        run: |
          cat > /tmp/live.mjs <<'JS'
          const M = await import(process.env.GITHUB_WORKSPACE + '/finanza-personale/js/market.js');
          const D = await import(process.env.GITHUB_WORKSPACE + '/finanza-personale/js/data/markets.js');
          const fmt = n => (n == null ? '—' : Number(n).toFixed(4));
          const items = [...D.MKT_CATEGORIES['Indici'], ...D.MKT_CATEGORIES['Materie Prime']];
          for (const it of items) {
            for (const r of ['1M', '1A']) {
              try { const q = await M.quote({ ...it, category: '' }, r); console.log(`ok ${r} ${it.name} → ${q.name} = ${q.price} ${q.currency || 'pt'} (${q.closes.length} chiusure, var ${q.change?.toFixed(2)})`); }
              catch (e) { console.log(`NO ${r} ${it.name} → ${e.message}`); }
            }
          }
          for (const n of ['Invesco Physical Gold ETC', 'Physical Gold', 'IE00B579F325', 'A1AA5X', '8PSG']) { const r = await M.ovSearch(n, 8); console.log('?', n, '→', r.map(x => x.name + ' ' + x.isin).join(' | ')); }
          JS
          node /tmp/live.mjs
