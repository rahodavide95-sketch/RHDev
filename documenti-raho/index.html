<title>Documenti Raho</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=Arimo:wght@400&amp;display=swap">
<style>
/* Layout: two-pane workbench — the form on the left, the live A4 pages on a desk to the right; on phones the two become tabs */
:root{
  --bg:#efefec; --panel:#ffffff; --fg:#171717; --muted:#5d5d59; --line:#d6d6d1; --field:#fbfbfa;
  --focus:#171717; --btn:#171717; --btn-fg:#ffffff; --desk:#e2e2dd; --warn:#7a4300; --warn-bg:#fff1dc; --ok:#1d5c34; --scrim:rgba(0,0,0,.45);
  /* the documents are paper: same values in both themes */
  --paper:#ffffff; --ink:#111111; --ink-2:#555555; --ink-3:#333333; --rule:#b5b5b5; --rule-soft:#dddddd; --ph:#7a7a7a; --dash:#767676;
  --ui:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, monospace;
  --doc:'Inter', 'Helvetica Neue', Arial, sans-serif;
  --logo:'Arimo', Arial, Helvetica, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --panel:#1b1b1a; --fg:#ececea; --muted:#a8a8a3; --line:#323230; --field:#161615;
    --focus:#ececea; --btn:#ececea; --btn-fg:#121212; --desk:#0a0a0a; --warn:#ffd08f; --warn-bg:#352611; --ok:#8fd6a6; --scrim:rgba(0,0,0,.65);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --panel:#1b1b1a; --fg:#ececea; --muted:#a8a8a3; --line:#323230; --field:#161615;
  --focus:#ececea; --btn:#ececea; --btn-fg:#121212; --desk:#0a0a0a; --warn:#ffd08f; --warn-bg:#352611; --ok:#8fd6a6; --scrim:rgba(0,0,0,.65);
  color-scheme:dark;
}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:14px;line-height:1.4;-webkit-text-size-adjust:100%}
.app{max-width:1480px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:16px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 20px}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--logo);font-weight:400;font-size:28px;letter-spacing:.04em;line-height:1}
.brand span{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.status{font-size:13px;color:var(--muted)}
.status.ok{color:var(--ok)}
.status.bad{color:var(--warn)}
.btn{appearance:none;-webkit-appearance:none;border:1px solid var(--btn);background:var(--btn);color:var(--btn-fg);font:600 14px/1 var(--ui);padding:0 18px;border-radius:6px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500}
.btn svg{width:16px;height:16px}

.tabs{display:none}
@media (max-width:940px){
  .tabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:6px}
  .tabs button{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 14px var(--ui);min-height:44px;cursor:pointer}
  .tabs button:first-child{border-radius:6px 0 0 6px}
  .tabs button:last-child{border-radius:0 6px 6px 0;border-left:0}
  .tabs button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
  body.view-form .desk{display:none}
  body.view-preview .form{display:none}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
}

.work{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:940px){.work{grid-template-columns:minmax(0,1fr)}}
/* side by side, the form and the sheets scroll on their own */
@media (min-width:941px){
  .app{height:100vh;height:100dvh;box-sizing:border-box;padding-bottom:20px}
  .work{flex:1;min-height:0;align-items:stretch;grid-template-rows:minmax(0,1fr)}
  .form,.desk{min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .form{padding:2px 6px 24px 2px}
}

.form{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2,.card summary{margin:0;font:500 12px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card h3{margin:4px 0 0;font:500 12px var(--ui);color:var(--muted)}
details.card summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"+";font-size:16px;letter-spacing:0}
details[open].card summary::after{content:"–"}
details.card > .inner{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:440px){.grid2{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f label{font-size:12.5px;color:var(--muted)}
input[type="text"],input[type="date"],select{font:16px var(--ui);color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:5px;padding:8px 10px;min-height:42px;width:100%;box-sizing:border-box;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type="date"]{min-height:42px;display:block}
input.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
input:focus-visible,select:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{padding:8px;text-align:center;cursor:pointer;font-weight:500;font-size:13.5px;min-height:44px;display:flex;align-items:center;justify-content:center;color:var(--fg);border:1px solid var(--line);border-radius:6px;background:var(--field)}
.seg input:checked + label{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.seg input:focus-visible + label{outline:2px solid var(--focus);outline-offset:2px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;cursor:pointer}
.check input{width:20px;height:20px;margin:0;accent-color:var(--btn);flex:none}
.hint{font-size:12.5px;color:var(--muted);line-height:1.45;margin:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sigthumb{height:40px;max-width:160px;background:#ffffff;border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px dashed var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:10px}
.line-head{display:flex;justify-content:space-between;align-items:center}
.line-head span{font:500 12px var(--mono);color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font:500 13px var(--ui);cursor:pointer;padding:6px 8px;min-height:36px;border-radius:4px}
.x:hover{color:var(--fg)}
.warn{background:var(--warn-bg);color:var(--warn);padding:10px 12px;border-radius:6px;font-size:13px;line-height:1.45}
input.code{font-family:var(--mono);letter-spacing:.02em}
.saved-list{display:flex;flex-direction:column}
.saved-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line);font-size:13.5px;overflow-wrap:anywhere}
.x.danger{color:var(--warn);align-self:flex-start;padding-left:0}

.desk{background:var(--desk);border-radius:10px;padding:28px;min-width:0;display:flex;flex-direction:column;gap:22px}
@media (max-width:940px){.desk{padding:12px;gap:12px}}
.sheet{position:relative;margin:0 auto;overflow:hidden;flex:none}
.pscale{position:absolute;top:0;left:0;width:794px;height:1123px;transform-origin:top left;box-shadow:0 1px 2px rgba(0,0,0,.10),0 10px 32px rgba(0,0,0,.14)}

/* signature pad */
.sigpad{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sigbox{background:var(--panel);border-radius:10px;padding:16px;width:min(640px,100%);display:flex;flex-direction:column;gap:12px}
.sigbox h2{margin:0;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#sigCanvas{width:100%;height:220px;background:#ffffff;border:1px solid var(--line);border-radius:6px;touch-action:none;cursor:crosshair;display:block}
.sigactions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* ---------- documents (A4 at 96 dpi) ---------- */
.paper{width:794px;height:1123px;box-sizing:border-box;padding:56px 64px 48px;display:flex;flex-direction:column;gap:26px;background:var(--paper);color:var(--ink);font-family:var(--doc);font-size:14px;line-height:1.3;overflow:hidden}
.paper.tight{gap:24px}
.paper.contract{gap:20px}
.paper .lbl{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.paper .lbl.rule{padding-bottom:8px;border-bottom:1px solid var(--rule)}
.paper .mono{font-family:var(--mono)}
.paper .ph{color:var(--ph)}
.paper b{font-weight:600}
.p-head{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:20px;border-bottom:3px solid var(--ink)}
.p-headl{display:flex;flex-direction:column;gap:10px;flex:none}
.p-logo{font-family:var(--logo);font-size:40px;font-weight:400;letter-spacing:.04em;line-height:1;white-space:nowrap}
.p-logoimg{display:block;height:44px;width:auto;max-width:280px;object-fit:contain;object-position:left bottom}
.p-headr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right;min-width:0}
.p-num{font-size:30px;font-weight:600;line-height:1}
.p-title{font-size:22px;font-weight:600;line-height:1.15;text-wrap:balance}
.p-date{font-family:var(--mono);font-size:13px}
.p-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px}
.p-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.p-name{font-size:14px;font-weight:600}
.p-addr{font-size:12.5px;line-height:1.5;overflow-wrap:anywhere}
.p-small{font-size:11px;color:var(--ink-2)}
.p-subj{display:flex;flex-direction:column;gap:8px}
.p-subj .s{font-size:15px}
.p-items{display:flex;flex-direction:column}
.p-tab{width:100%;border-collapse:collapse;font-size:14px}
.p-tab th{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:0 0 10px;border-bottom:1px solid var(--ink)}
.p-tab th:last-child{text-align:right}
.p-tab td{padding:14px 0 16px;vertical-align:top}
.p-tab td.amt{text-align:right;font-family:var(--mono);white-space:nowrap}
.p-tab td.per{font-family:var(--mono);font-size:13px;padding-right:12px}
.p-tab tr.rel + tr.rel td{border-top:1px solid var(--rule-soft)}
.p-tab .t{font-weight:600}
.p-tab .meta{font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:4px}
.p-tab tr.sum td{padding:10px 0 0}
.p-tab tr.sum.first td{border-top:1px solid var(--rule);padding-top:12px}
.p-tab tr.sum.last td{padding-bottom:14px}
.p-total{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding-top:14px;border-top:3px solid var(--ink)}
.p-total .k{font-family:var(--mono);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.p-total .v{font-size:34px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.p-note{font-size:12px;line-height:1.5;color:var(--ink-3)}
.p-pay{display:grid;grid-template-columns:92px minmax(0,1fr);row-gap:8px;column-gap:12px;font-size:13px;line-height:1.4}
.p-pay .k{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.p-pay .m{font-family:var(--mono);overflow-wrap:anywhere}
.p-col.notes{gap:10px}
.p-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}
.p-foot.nobollo{justify-content:flex-end}
.p-bollo{display:flex;flex-direction:column;gap:8px}
.p-box{width:112px;height:122px;box-sizing:border-box;border:1px dashed var(--dash);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.p-box b{font-weight:400;font-size:14px;color:var(--ink)}
.p-sign{width:260px;display:flex;flex-direction:column;gap:8px}
.p-sign .ln{height:56px;border-bottom:1px solid var(--ink);display:flex;align-items:flex-end;justify-content:center}
.sigimg{display:block;max-height:58px;max-width:240px;width:auto;margin-bottom:-6px}

/* contracts */
.c-top{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:14px;border-bottom:1px solid var(--ink)}
.c-top .p-logo{font-size:22px}
.c-top .p-logoimg{height:24px}
.c-intro{font-size:14px;line-height:1.55;margin:0}
.c-sec{display:flex;flex-direction:column;gap:16px}
.c-h{font-size:22px;font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
.c-group{display:flex;flex-direction:column;gap:0}
.c-gh{display:flex;align-items:baseline;gap:12px;padding-bottom:8px;border-bottom:1px solid var(--ink)}
.c-gh .g{font-family:var(--mono);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.c-gh .n{font-size:12px;color:var(--ink-2)}
.kv{display:grid;grid-template-columns:190px minmax(0,1fr)}
.kv > div{padding:5px 0;border-bottom:1px solid var(--rule-soft);font-size:13.5px;line-height:1.4;overflow-wrap:anywhere}
.kv > div.k{font-family:var(--mono);font-size:12px;color:var(--ink-2);padding-right:14px;padding-top:6px}
.c-p{font-size:14px;line-height:1.6;margin:0}
.c-list{margin:0;padding:0 0 0 24px;display:flex;flex-direction:column;gap:12px;font-size:13.5px;line-height:1.6}
.c-list li{padding-left:4px}
.c-list li::marker{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.c-bul{margin:0;padding:0 0 0 18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.5}
.c-tab{width:100%;border-collapse:collapse;font-size:13.5px;line-height:1.45}
.c-tab th{font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:0 12px 8px 0;border-bottom:1px solid var(--ink)}
.c-tab td{padding:9px 12px 9px 0;vertical-align:top;border-bottom:1px solid var(--rule-soft)}
.c-tab td:first-child{font-family:var(--mono);font-size:12px;color:var(--ink-2);width:170px;padding-top:10px}
.c-sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:40px;margin-top:8px}
.c-sig{display:flex;flex-direction:column;gap:10px}
.c-sig .fld{display:flex;flex-direction:column;gap:4px}
.c-sig .fld .k{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.c-sig .fld .v{min-height:20px;border-bottom:1px solid var(--rule);padding-bottom:4px;font-size:13.5px}
.c-sig .area{height:76px;border-bottom:1px solid var(--ink);display:flex;align-items:flex-end;justify-content:center}
.c-sig .area .sigimg{max-height:72px}
.c-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding-top:12px;border-top:1px solid var(--rule);font-family:var(--mono);font-size:12px;color:var(--ink-2)}

/* fit: a page that would spill off the sheet gets tighter spacing, same design */
.paper.fit{gap:16px}
.paper.fit .p-head{padding-bottom:14px}
.paper.fit .p-col{gap:6px}
.paper.fit .p-col.notes{gap:7px}
.paper.fit .p-note{line-height:1.42}
.paper.fit .p-tab td{padding:9px 0 10px}
.paper.fit .p-tab tr.sum td{padding:8px 0 0}
.paper.fit .p-tab tr.sum.first td{padding-top:10px}
.paper.fit .p-tab tr.sum.last td{padding-bottom:10px}
.paper.fit .p-total{padding-top:10px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<div class="app">
  <header class="top">
    <div class="brand"><h1>RAHO</h1><span>Documenti</span></div>
    <div class="actions">
      <span class="status" id="status" role="status"></span>
      <button class="btn" id="exportBtn" type="button">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M8 2v8M4.5 6.5 8 10l3.5-3.5M3 13h10"/></svg>
        Scarica PDF
      </button>
    </div>
  </header>

  <div class="tabs" role="group" aria-label="Vista">
    <button type="button" id="tabForm" aria-pressed="true">Compila</button>
    <button type="button" id="tabPreview" aria-pressed="false">Anteprima</button>
  </div>

  <div class="work">
    <form class="form" id="form" autocomplete="off">
      <section class="card">
        <h2>Documento</h2>
        <h3>Booking</h3>
        <div class="seg" role="radiogroup" aria-label="Documenti booking">
          <input type="radio" name="doc" id="doc-bkc-en" value="bkc-en"><label for="doc-bkc-en">Contratto EN</label>
          <input type="radio" name="doc" id="doc-bkc-it" value="bkc-it"><label for="doc-bkc-it">Contratto IT</label>
          <input type="radio" name="doc" id="doc-bkr-est" value="bkr-est"><label for="doc-bkr-est">Ricevuta estera</label>
          <input type="radio" name="doc" id="doc-bkr-it" value="bkr-it"><label for="doc-bkr-it">Ricevuta italiana</label>
        </div>
        <h3>Royalties</h3>
        <div class="seg" role="radiogroup" aria-label="Documenti royalties">
          <input type="radio" name="doc" id="doc-roy-est" value="roy-est"><label for="doc-roy-est">Label estera</label>
          <input type="radio" name="doc" id="doc-roy-it" value="roy-it"><label for="doc-roy-it">Label italiana</label>
        </div>
      </section>

      <section class="card">
        <h2>Logo e firma</h2>
        <div class="seg three" role="radiogroup" aria-label="Logo">
          <input type="radio" name="logo" id="logo-raho" value="raho"><label for="logo-raho">RAHO</label>
          <input type="radio" name="logo" id="logo-rhbkng" value="rhbkng"><label for="logo-rhbkng">RH[BKNG]</label>
          <input type="radio" name="logo" id="logo-img" value="img"><label for="logo-img">Immagine</label>
        </div>
        <div class="row" id="logoImgRow" hidden>
          <button type="button" class="btn ghost" id="logoPick">Carica il logo</button>
          <span class="hint" id="logoHint">PNG o JPG, meglio con sfondo trasparente.</span>
          <input type="file" id="logoFile" accept="image/*" hidden>
        </div>
        <label class="check" for="sigUse"><input type="checkbox" id="sigUse"><span>Aggiungi la mia firma</span></label>
        <div class="row">
          <button type="button" class="btn ghost" id="sigOpen">Disegna la firma</button>
          <img class="sigthumb" id="sigThumb" alt="La tua firma" hidden>
        </div>
        <p class="hint">Con il dito, la Apple Pencil o il trackpad. Resta salvata in questo browser.</p>
      </section>

      <div id="fields"></div>
    </form>

    <div class="desk" id="desk" aria-label="Anteprima">
      <div class="warn" id="overflowWarn" hidden></div>
      <div id="pages" style="display:flex;flex-direction:column;gap:22px"></div>
    </div>
  </div>
</div>

<div class="sigpad" id="sigpad" hidden>
  <div class="sigbox" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
    <h2 id="sigTitle">Firma qui</h2>
    <canvas id="sigCanvas" aria-label="Riquadro per la firma"></canvas>
    <div class="sigactions">
      <button type="button" class="btn ghost" id="sigClear">Cancella</button>
      <div class="row">
        <button type="button" class="btn ghost" id="sigCancel">Annulla</button>
        <button type="button" class="btn" id="sigSave">Usa questa firma</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var KEY = 'raho-documenti-v1';
  var OLD_KEY = 'raho-ricevute-v1';
  var BOLLO_SOGLIA = 77.47;
  var fmtIT = new Intl.NumberFormat('it-IT', {minimumFractionDigits:2, maximumFractionDigits:2, useGrouping:'always'});
  var fmtEN = new Intl.NumberFormat('en-GB', {minimumFractionDigits:2, maximumFractionDigits:2});

  var DOCS = {
    'bkc-en': {cat:'bk', kind:'contract', lang:'en', name:'Contract'},
    'bkc-it': {cat:'bk', kind:'contract', lang:'it', name:'Contratto'},
    'bkr-est': {cat:'bk', kind:'receipt', est:true, name:'Ricevuta booking'},
    'bkr-it': {cat:'bk', kind:'receipt', est:false, name:'Ricevuta booking'},
    'roy-est': {cat:'roy', kind:'receipt', est:true, name:'Ricevuta royalties'},
    'roy-it': {cat:'roy', kind:'receipt', est:false, name:'Ricevuta royalties'}
  };

  function todayISO(){ var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  function emptyLine(){ return {title:'', cat:'', stmt:'', period:'', amount:''}; }
  function defaults(){
    return {
      doc:'bkc-en', logo:{bk:'rhbkng', roy:'raho'}, logoImg:'', sig:{use:false, img:''},
      number:'1/' + new Date().getFullYear(), date: todayISO(), bolloId:'',
      me:{name:'', addr:'', city:'', cf:'', email:'', bookingEmail:''},
      accounts:[], acc:'',
      label:{name:'', addr:'', city:'', country:'', vat:'', piva:'', cf:''},
      lines:[emptyLine()], rit:true,
      client:{name:'', rep:'', addr:'', city:'', country:'', vat:'', piva:'', cf:'', contact:''},
      ev:{name:'', venue:'', address:'', date:'', start:'', end:'', duration:'', doors:'', check:'', capacity:'', billing:'headliner', others:''},
      fee:{amount:'', net:true, rit:true, expenses:'', contractDate:''},
      t:{depositPct:'50', depositDays:'7', balance:'cash', balanceDate:'', certDays:'30', transport:'Treno', from:'', to:'', persons:'1', bags:'1', pnrDays:'7', carAmount:'',
         nights:'1', room:'single', stars:'3', minutes:'15', meals:'', guests:'2', drinks:'', cdj:'4', mixer:'Pioneer DJM-V10', changeDays:'7',
         cancelDays:'30', refundDays:'14', fmMonths:'6', law:'Italian', foro:''},
      c:{place:'', date:''},
      saved:{labels:{}, clients:{}}
    };
  }
  function merge(d, s){
    if (!s || typeof s !== 'object') return d;
    Object.keys(d).forEach(function(k){
      if (!(k in s)) return;
      if (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) d[k] = merge(d[k], s[k]);
      else if (Array.isArray(d[k])) { if (Array.isArray(s[k]) && s[k].length) d[k] = s[k]; }
      else d[k] = s[k];
    });
    return d;
  }
  function newId(){ return 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  // the IBAN used to live in "me": it becomes the first saved account
  function load(o){
    var s = merge(defaults(), o), me = (o && o.me) || {};
    // merge() keeps only the keys defaults() has, so the saved labels and clients are copied as they are
    ['labels', 'clients'].forEach(function(k){ var v = o && o.saved && o.saved[k]; if (v && typeof v === 'object' && !Array.isArray(v)) s.saved[k] = v; });
    if (!s.accounts.length && has(me.iban)) s.accounts = [{id:newId(), label:'', holder:'', iban:me.iban, bic:me.bic || ''}];
    s.accounts = s.accounts.filter(function(a){ return a && typeof a === 'object'; });
    s.accounts.forEach(function(a){ if (!a.id) a.id = newId(); });
    if (!DOCS[s.doc]) s.doc = 'bkc-en';
    return s;
  }
  var state = defaults();
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) state = load(JSON.parse(raw));
    else {
      var old = localStorage.getItem(OLD_KEY);
      if (old) {
        var o = JSON.parse(old);
        state = load({me:o.me, label:o.label});
        if (o.number) state.number = o.number;
        if (o.saved && typeof o.saved === 'object') Object.keys(o.saved).forEach(function(k){ state.saved.labels[k] = o.saved[k]; });
      }
    }
  } catch (e) {}
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  // ---------- helpers ----------
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function has(v){ return String(v == null ? '' : v).trim() !== ''; }
  function val(v, ph){ return has(v) ? esc(String(v).trim()) : '<span class="ph">[' + esc(ph) + ']</span>'; }
  function parseAmount(s){
    s = String(s || '').replace(/[€\s]/g, '').replace(/EUR/i, '');
    if (!s) return null;
    var c = s.lastIndexOf(','), d = s.lastIndexOf('.');
    if (c > d) s = s.replace(/\./g, '').replace(',', '.');         // 1.500,50 · 1500,50
    else if (c !== -1) s = s.replace(/,/g, '');                    // 1,500.50
    else if (/^[1-9]\d{0,2}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, ''); // 1.500 = millecinquecento
    var n = Number(s);
    return isFinite(n) ? Math.round(n * 100) / 100 : null;
  }
  function r2(n){ return Math.round(n * 100) / 100; }
  function money(n){ return '€ ' + fmtIT.format(n); }
  function itDate(iso){ var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || ''); return m ? m[3] + '/' + m[2] + '/' + m[1] : ''; }
  function get(path){ return path.split('.').reduce(function(o,k){ return o == null ? '' : o[k]; }, state); }
  function set(path, v){ var ks = path.split('.'), o = state; for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length-1]] = v; }
  function D(){ return DOCS[state.doc]; }
  function account(){ return state.accounts.filter(function(a){ return a.id === state.acc; })[0] || state.accounts[0] || {}; }
  function accName(a, i){ return has(a.label) ? String(a.label).trim() : has(a.iban) ? 'IBAN …' + String(a.iban).replace(/\s/g, '').slice(-4) : 'Conto ' + (i + 1); }

  function logoHtml(){
    var mode = state.logo[D().cat];
    if (mode === 'img' && state.logoImg) return '<img class="p-logoimg" src="' + state.logoImg + '" alt="Logo">';
    return '<div class="p-logo">' + (mode === 'rhbkng' ? 'RH[BKNG]' : 'RAHO') + '</div>';
  }
  function sigHtml(){ return state.sig.use && state.sig.img ? '<img class="sigimg" src="' + state.sig.img + '" alt="">' : ''; }

  // ---------- receipts ----------
  function receiptPage(o){
    var est = o.est, M = state.me, num = val(state.number, '1/2026');
    var h = '<header class="p-head"><div class="p-headl">' + logoHtml()
      + '<div class="lbl">' + o.sub + '</div></div>'
      + '<div class="p-headr"><div class="lbl">' + (est ? 'Ricevuta n. / Receipt no.' : 'Ricevuta n.') + '</div>'
      + '<div class="p-num">' + num + '</div>'
      + '<div class="p-date">' + (est ? 'Data / Date: ' : 'Data: ') + val(itDate(state.date), 'GG/MM/AAAA') + '</div></div></header>';
    var meLines = [ val(M.addr, 'Via, numero'),
      val(M.city, 'CAP Città') + (est ? ', Italia / Italy' : ''),
      (est ? 'C.F. / Tax code: ' : 'C.F.: ') + val(M.cf, 'CODICE FISCALE'), val(M.email, 'email') ];
    h += '<section class="p-two"><div class="p-col"><div class="lbl rule">' + (est ? 'Emittente / Issuer' : 'Emittente') + '</div>'
      + '<div class="p-name">' + val(M.name, 'Nome Cognome') + '</div><div class="p-addr">' + meLines.join('<br>') + '</div>'
      + '<div class="p-small">' + (est ? 'Privato senza P.IVA · Not VAT-registered' : 'Persona fisica senza partita IVA') + '</div></div>'
      + '<div class="p-col"><div class="lbl rule">' + (est ? 'Destinatario / Bill to' : 'Destinatario') + '</div>'
      + '<div class="p-name">' + o.toName + '</div><div class="p-addr">' + o.toLines.join('<br>') + '</div></div></section>';
    h += '<section class="p-subj"><div class="lbl">' + (est ? 'Oggetto / Description' : 'Oggetto') + '</div><div class="s">' + o.subject + '</div></section>';
    h += '<section class="p-items"><table class="p-tab"><thead><tr><th>' + o.cols[0] + '</th><th>' + o.cols[1] + '</th><th>' + o.cols[2] + '</th></tr></thead><tbody>'
      + o.rows + '</tbody></table><div class="p-total"><div class="k">' + o.totalLabel + '</div><div class="v">' + o.totalValue + '</div></div></section>';
    var causale = 'Ricevuta n. ' + num + (est ? ' / Receipt no. ' + num : '');
    var A = account();
    var pay = '<div class="k">Intestatario</div><div>' + val(has(A.holder) ? A.holder : M.name, 'Nome Cognome') + '</div>'
      + '<div class="k">IBAN</div><div class="m">' + val(A.iban, 'IT00 X000 0000 0000 0000 0000 000') + '</div>'
      + (est ? '<div class="k">BIC / SWIFT</div><div class="m">' + val(A.bic, 'XXXXITXX') + '</div>' : '')
      + '<div class="k">Causale</div><div>' + causale + '</div>';
    h += '<section class="p-two"><div class="p-col notes"><div class="lbl rule">' + (est ? 'Note fiscali / Tax notes' : 'Note fiscali') + '</div>'
      + o.notes.map(function(n){ return '<div class="p-note">' + esc(n) + '</div>'; }).join('') + '</div>'
      + '<div class="p-col notes"><div class="lbl rule">' + (est ? 'Pagamento / Payment' : 'Pagamento') + '</div><div class="p-pay">' + pay + '</div></div></section>';
    h += '<footer class="p-foot' + (o.bollo ? '' : ' nobollo') + '">'
      + (o.bollo ? '<div class="p-bollo"><div class="p-box">Marca da bollo<b>€ 2,00</b></div><div class="mono" style="font-size:12px;color:var(--ink-2)">ID ' + val(state.bolloId, '14 cifre') + '</div></div>' : '')
      + '<div class="p-sign"><div class="ln">' + sigHtml() + '</div><div class="lbl">' + (est ? 'Firma / Signature' : 'Firma') + '</div></div></footer>';
    return {html:h, cls: est ? '' : 'tight'};
  }

  function royaltyTotals(){
    var lordo = 0, any = false;
    state.lines.forEach(function(l){ var n = parseAmount(l.amount); if (n != null) { lordo += n; any = true; } });
    lordo = r2(lordo);
    var rit = state.doc === 'roy-it' && state.rit ? r2(lordo * 0.2) : 0;
    return {lordo:lordo, rit:rit, netto:r2(lordo - rit), any:any};
  }
  function bookingTotals(){
    var d = state.doc, n = parseAmount(state.fee.amount), any = n != null; n = n || 0;
    if (d === 'bkr-it') {
      var rit = !!state.fee.rit, lordo = rit && state.fee.net ? r2(n / 0.8) : n;
      var r = rit ? r2(lordo * 0.2) : 0;
      if (rit && state.fee.net) r = r2(lordo - n);
      return {any:any, lordo:lordo, rit:r, netto:r2(lordo - r), total:r2(lordo - r)};
    }
    var ex = parseAmount(state.fee.expenses) || 0;
    return {any:any, lordo:n, rit:0, ex:ex, total:r2(n + ex)};
  }

  function royaltyReceipt(){
    var est = state.doc === 'roy-est', L = state.label, t = royaltyTotals();
    var amt = function(n){ return t.any ? money(n) : '<span class="ph">€ [0,00]</span>'; };
    var toLines = [ val(L.addr, 'Indirizzo'), val(L.city, 'CAP Città') ];
    if (est) { toLines.push(val(L.country, 'Paese / Country')); toLines.push('VAT / Tax ID: ' + val(L.vat, 'numero')); }
    else { toLines.push('P.IVA: ' + val(L.piva, 'numero')); toLines.push('C.F.: ' + val(L.cf, 'numero')); }
    var rows = state.lines.map(function(l){
      var n = parseAmount(l.amount);
      return '<tr class="rel"><td><div class="t">' + val(l.title, 'Titolo release') + '</div><div class="meta">Cat. ' + val(l.cat, 'XXX000') + ' · Statement ' + val(l.stmt, 'n.') + '</div></td>'
        + '<td class="per">' + val(l.period, 'GG/MM/AA – GG/MM/AA') + '</td>'
        + '<td class="amt">' + (n != null ? money(n) : '<span class="ph">€ [0,00]</span>') + '</td></tr>';
    }).join('');
    if (!est) {
      rows += '<tr class="sum first' + (state.rit ? '' : ' last') + '"><td colspan="2">Compenso lordo</td><td class="amt">' + amt(t.lordo) + '</td></tr>';
      if (state.rit) rows += '<tr class="sum last"><td colspan="2">Ritenuta d\'acconto 20%</td><td class="amt">– ' + amt(t.rit) + '</td></tr>';
    }
    var bollo = t.lordo > BOLLO_SOGLIA || !t.any, notes = [];
    if (est) {
      notes.push('Operazione non soggetta a IVA per mancanza del presupposto soggettivo (art. 5 DPR 633/1972). Not subject to Italian VAT.');
      notes.push('Nessuna ritenuta d\'acconto italiana: committente non residente in Italia. No Italian withholding tax: payer not resident in Italy.');
      if (bollo) notes.push('Imposta di bollo da € 2,00 assolta sull\'originale. Italian stamp duty of EUR 2.00 paid on the original.');
    } else {
      notes.push('Operazione non soggetta a IVA per mancanza del presupposto soggettivo (art. 5 DPR 633/1972).');
      notes.push(state.rit ? 'Ritenuta d\'acconto del 20% sul compenso lordo, versata dal committente in qualità di sostituto d\'imposta (art. 25 DPR 600/1973), che rilascerà la Certificazione Unica.'
        : 'Nessuna ritenuta d\'acconto: committente in regime forfettario, non sostituto d\'imposta.');
      if (bollo) notes.push('Imposta di bollo da € 2,00 assolta sull\'originale.');
    }
    return receiptPage({ est:est, sub: est ? 'Ricevuta royalties · Royalty receipt' : 'Ricevuta royalties',
      toName: val(L.name, 'Ragione sociale etichetta'), toLines: toLines, subject: 'Royalties',
      cols: est ? ['Release', 'Periodo / Period', 'Importo / Amount'] : ['Release', 'Periodo', 'Importo'],
      rows: rows, totalLabel: est ? 'Totale da pagare / Total due' : 'Netto da pagare', totalValue: amt(est ? t.lordo : t.netto),
      notes: notes, bollo: bollo });
  }

  function bookingReceipt(){
    var est = state.doc === 'bkr-est', C = state.client, E = state.ev, F = state.fee, t = bookingTotals();
    var amt = function(n){ return t.any ? money(n) : '<span class="ph">€ [0,00]</span>'; };
    var toLines = [ val(C.addr, 'Indirizzo'), val(C.city, 'CAP Città') ];
    if (est) { toLines.push(val(C.country, 'Paese / Country')); toLines.push('VAT / Tax ID: ' + val(C.vat, 'numero')); }
    else { toLines.push('P.IVA: ' + val(C.piva, 'numero')); toLines.push('C.F.: ' + val(C.cf, 'numero')); }
    var meta = val(E.venue, est ? 'Locale / Venue' : 'Locale') + (has(E.address) ? ', ' + esc(E.address) : '');
    if (has(F.contractDate)) meta += '<br>' + (est ? 'Contratto del / Agreement dated ' : 'Contratto del ') + esc(itDate(F.contractDate));
    var rows = '<tr class="rel"><td><div class="t">' + val(E.name, est ? 'Nome evento / Event' : 'Nome evento') + '</div><div class="meta">' + meta + '</div></td>'
      + '<td class="per">' + val(itDate(E.date), 'GG/MM/AAAA') + '</td><td class="amt">' + amt(t.lordo) + '</td></tr>';
    if (est && t.ex) rows += '<tr class="sum first last"><td colspan="2">Rimborso spese / Expense reimbursement</td><td class="amt">' + money(t.ex) + '</td></tr>';
    if (!est) {
      rows += '<tr class="sum first' + (F.rit ? '' : ' last') + '"><td colspan="2">Compenso lordo</td><td class="amt">' + amt(t.lordo) + '</td></tr>';
      if (F.rit) rows += '<tr class="sum last"><td colspan="2">Ritenuta d\'acconto 20%</td><td class="amt">– ' + amt(t.rit) + '</td></tr>';
    }
    var bollo = t.lordo > BOLLO_SOGLIA || !t.any, notes = [];
    if (est) {
      notes.push('Prestazione di lavoro autonomo occasionale, fuori campo IVA (art. 5 DPR 633/1972). Occasional self-employed service, not subject to Italian VAT.');
      notes.push('Nessuna ritenuta italiana. Eventuali ritenute estere sono a carico del committente, come da contratto. No Italian withholding tax; any foreign withholding tax is borne by the client, as agreed.');
      notes.push('Viaggio e alloggio pagati direttamente dal committente, non inclusi. Travel and accommodation paid directly by the client, not included.');
      if (bollo) notes.push('Imposta di bollo da € 2,00 assolta sull\'originale. Italian stamp duty of EUR 2.00 paid on the original.');
    } else {
      notes.push('Prestazione di lavoro autonomo occasionale (art. 2222 c.c.), non soggetta a IVA per mancanza del presupposto soggettivo (art. 5 DPR 633/1972).');
      notes.push(F.rit ? 'Ritenuta d\'acconto del 20% sul compenso lordo, versata dal committente in qualità di sostituto d\'imposta (art. 25 DPR 600/1973), che rilascerà la Certificazione Unica.'
        : 'Nessuna ritenuta d\'acconto: committente non sostituto d\'imposta.');
      if (bollo) notes.push('Imposta di bollo da € 2,00 assolta sull\'originale, a carico del committente.');
    }
    return receiptPage({ est:est, sub: est ? 'Ricevuta prestazione · Performance receipt' : 'Ricevuta prestazione occasionale',
      toName: val(C.name, est ? 'Company name' : 'Ragione sociale'), toLines: toLines,
      subject: est ? 'Esibizione DJ come Raho · DJ performance as Raho' : 'Esibizione DJ come Raho',
      cols: est ? ['Evento / Event', 'Data / Date', 'Importo / Amount'] : ['Evento', 'Data', 'Importo'],
      rows: rows, totalLabel: est ? 'Totale da pagare / Total due' : 'Netto da pagare', totalValue: amt(t.total),
      notes: notes, bollo: bollo });
  }

  // ---------- contracts ----------
  function contractPages(){
    var en = state.doc === 'bkc-en', M = state.me, C = state.client, E = state.ev, T = state.t;
    var fmt = en ? fmtEN : fmtIT;
    var net = parseAmount(state.fee.amount);
    var eur = function(n){ return n == null ? '<span class="ph">[' + (en ? 'amount' : 'importo') + ']</span>' : fmt.format(n); };
    var pct = parseFloat(String(T.depositPct).replace(',', '.'));
    var dep = net != null && isFinite(pct) ? r2(net * pct / 100) : null;
    var bal = net != null && dep != null ? r2(net - dep) : null;
    var balPct = isFinite(pct) ? r2(100 - pct) : null;
    var n = function(v, ph){ return val(v, ph); };
    var kv = function(rows){ return '<div class="kv">' + rows.map(function(r){ return '<div class="k">' + r[0] + '</div><div>' + r[1] + '</div>'; }).join('') + '</div>'; };
    var group = function(title, note, rows){ return '<div class="c-group"><div class="c-gh"><span class="g">' + title + '</span>' + (note ? '<span class="n">' + note + '</span>' : '') + '</div>' + kv(rows) + '</div>'; };
    var ol = function(items){ return '<ol class="c-list">' + items.map(function(i){ return '<li>' + i + '</li>'; }).join('') + '</ol>'; };
    var title = en ? 'DJ Performance Agreement' : 'Contratto di prestazione artistica';
    var total = 6, pages = [];
    var top = function(i){
      if (i === 1) return '<header class="p-head"><div class="p-headl">' + logoHtml() + '<div class="lbl">' + (en ? 'Booking contract · Abroad' : 'Contratto di booking · Italia') + '</div></div>'
        + '<div class="p-headr"><div class="lbl">' + (en ? 'Agreement' : 'Contratto') + '</div><div class="p-title">' + title + '</div>'
        + '<div class="p-date">' + (en ? 'Date: ' : 'Data: ') + val(itDate(state.c.date), 'GG/MM/AAAA') + '</div></div></header>';
      return '<header class="c-top">' + logoHtml() + '<div class="lbl">' + title + '</div></header>';
    };
    var foot = function(i){
      return '<footer class="c-foot"><span>' + (en ? 'Initials: Artist ______ Promoter ______' : 'Sigle: Artista ______ Committente ______') + '</span><span>'
        + (en ? 'Page ' + i + ' of ' + total : 'Pagina ' + i + ' di ' + total) + '</span></footer>';
    };
    var page = function(i, body){ pages.push({html: top(i) + body + foot(i), cls:'contract'}); };
    var set = n(E.start, en ? 'Start' : 'Inizio') + ' – ' + n(E.end, en ? 'End' : 'Fine') + ', ' + n(E.duration, en ? 'duration' : 'durata') + (en ? ' minutes' : ' minuti');
    var room = en ? (T.room === 'double' ? 'double' : 'single') : (T.room === 'double' ? 'doppia' : 'singola');
    var bill = esc(T && E.billing || 'headliner');
    var drinksEN = 'still water' + (has(T.drinks) ? ' and ' + esc(T.drinks) : '');
    var drinksIT = 'acqua naturale' + (has(T.drinks) ? ' e ' + esc(T.drinks) : '');

    if (en) {
      page(1, '<p class="c-intro">This Agreement is made between the Artist and the Promoter for the performance described below.</p>'
        + '<section class="c-sec"><h2 class="c-h">1. Parties and event</h2>'
        + group('Artist', '', [['Stage name','Raho'],['Legal name', n(M.name,'Full name')],['Italian tax code', n(M.cf,'Codice fiscale')],['Tax residence','Italy'],
            ['Status','Private individual, not VAT-registered. Independent self-employed artist'],['Booking contact', n(M.bookingEmail,'Booking email')],

  // backup: one JSON file with everything, to move the data to another device or browser
  async function exportData(){
    var name = 'Documenti Raho backup ' + todayISO() + '.json';
    var blob = new Blob([JSON.stringify({app:'documenti-raho', version:1, state:state}, null, 2)], {type:'application/json'});
    try {
      var dl = await downloadsP;
      if (dl) await dl.save({filename:name, data:blob});
      else if (inClaude) { setStatus('Il download non è disponibile in questa vista. Apri la pagina su claude.ai.', 'bad'); return; }
      else {
        var url = URL.createObjectURL(blob), link = document.createElement('a');
        link.href = url; link.download = name; document.body.appendChild(link); link.click();
        setTimeout(function(){ URL.revokeObjectURL(url); link.remove(); }, 1000);
      }
      setStatus('Backup scaricato. Tienilo al sicuro: contiene IBAN e codice fiscale.', 'ok');
    } catch (err) {
      setStatus(err && err.code === 'declined' ? 'Download annullato.' : 'Non sono riuscito a creare il backup.', 'bad');
    }
  }
  function importData(file){
    var reader = new FileReader();
    reader.onload = function(){
      try {
        var o = JSON.parse(reader.result), s = o && o.state && typeof o.state === 'object' ? o.state : o;
        if (!s || typeof s !== 'object' || !s.me) throw new Error('not a backup');
        state = load(s); openCards = {}; persist(); syncTop(); renderFields(); update();
        setStatus('Backup caricato: i tuoi dati sono di nuovo qui.', 'ok');
      } catch (err) { setStatus('Questo file non è un backup di Documenti Raho.', 'bad'); }
    };
    reader.readAsText(file);
  }

      var m1 = {x:(a.x + b.x) / 2, y:(a.y + b.y) / 2}, m2 = {x:(b.x + c.x) / 2, y:(b.y + c.y) / 2};
      ctx.lineWidth = 1.4 + b.p * 2.2;
      ctx.beginPath(); ctx.moveTo(m1.x, m1.y); ctx.quadraticCurveTo(b.x, b.y, m2.x, m2.y); ctx.stroke();
    });
    inked = true;
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(t){ cv.addEventListener(t, function(){ drawing = false; pts = []; }); });
  document.getElementById('sigClear').addEventListener('click', function(){ ctx.clearRect(0, 0, cv.width, cv.height); inked = false; });
  document.getElementById('sigCancel').addEventListener('click', closePad);
  pad.addEventListener('keydown', function(e){ if (e.key === 'Escape') closePad(); });
  document.getElementById('sigOpen').addEventListener('click', openPad);
  document.getElementById('sigSave').addEventListener('click', function(){
    if (!inked) { closePad(); return; }
    var w = cv.width, h = cv.height, data = ctx.getImageData(0, 0, w, h).data, minX = w, minY = h, maxX = -1, maxY = -1;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) if (data[(y * w + x) * 4 + 3] > 10) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    if (maxX < 0) { closePad(); return; }
    var padPx = 6, cw = Math.min(w, maxX - minX + padPx * 2), ch = Math.min(h, maxY - minY + padPx * 2);
    var out = document.createElement('canvas'); out.width = cw; out.height = ch;
    out.getContext('2d').drawImage(cv, Math.max(0, minX - padPx), Math.max(0, minY - padPx), cw, ch, 0, 0, cw, ch);
    state.sig.img = out.toDataURL('image/png'); state.sig.use = true;
    closePad(); syncTop(); update();
  });

  // ---------- PDF ----------
  var inClaude = !!(window.claude && window.claude.use);
  var downloadsP = inClaude ? window.claude.use('downloads') : Promise.resolve(null);
  var btn = document.getElementById('exportBtn');
  function fileName(){
    var d = D(), c = d.cat === 'roy' ? state.label.name : state.client.name;
    c = String(c || '').replace(/[^\p{L}\p{N} ._-]/gu, '').replace(/\s+/g, ' ').trim();
    if (d.kind === 'contract') return (d.lang === 'en' ? 'Raho Contract' : 'Raho Contratto') + (c ? ' ' + c : '') + (has(state.ev.date) ? ' ' + state.ev.date : '') + '.pdf';
    return 'Ricevuta ' + String(state.number || '').replace(/[\/\\]/g, '-') + (c ? ' ' + c : '') + '.pdf';
  }
  function bumpNumber(){
    var m = /^(\d+)\/(\d{4})$/.exec((state.number || '').trim()), y = new Date().getFullYear();
    if (m) state.number = (+m[2] === y ? (+m[1] + 1) : 1) + '/' + y;
  }
  btn.addEventListener('click', async function(){
    if (!window.html2canvas || !window.jspdf) { setStatus('Il generatore di PDF non si è caricato. Ricarica la pagina.', 'bad'); return; }
    btn.disabled = true; setStatus('Preparo il PDF…');
    var wasPreview = document.body.classList.contains('view-preview');
    try {
      if (!wasPreview && window.matchMedia('(max-width:940px)').matches) setView('preview');
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      var touch = navigator.maxTouchPoints > 1, scale = touch ? 2 : 3;
      var papers = Array.prototype.slice.call(pagesEl.querySelectorAll('.paper'));
      var pdf = new window.jspdf.jsPDF({unit:'mm', format:'a4', orientation:'portrait', compress:true});
      for (var i = 0; i < papers.length; i++) {
        setStatus('Preparo il PDF… pagina ' + (i + 1) + ' di ' + papers.length);
        var canvas = await window.html2canvas(papers[i], { scale: scale, backgroundColor: '#ffffff', logging: false,
          onclone: function(doc){ doc.querySelectorAll('.pscale').forEach(function(s){ s.style.transform = 'none'; s.style.boxShadow = 'none'; }); } });
        if (i > 0) pdf.addPage('a4', 'portrait');
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
        canvas.width = canvas.height = 1;
      }
      pdf.setProperties({title: fileName().replace(/\.pdf$/, ''), author: state.me.name || 'Raho'});
      var name = fileName(), d = D();
      var dl = await downloadsP;
      if (dl) await dl.save({filename: name, data: pdf.output('blob')});
      else if (inClaude) { setStatus('Il download non è disponibile in questa vista. Apri la pagina su claude.ai.', 'bad'); return; }
      else pdf.save(name);
      if (d.kind === 'receipt') {
        var key = d.cat === 'roy' ? 'labels' : 'clients', obj = d.cat === 'roy' ? state.label : state.client;
        if (has(obj.name)) state.saved[key][obj.name.trim()] = JSON.parse(JSON.stringify(obj));
        var prev = state.number; bumpNumber();
        setStatus('Salvata la ricevuta ' + prev + '. Il prossimo numero è ' + state.number + '.', 'ok');
      } else {
        if (has(state.client.name)) state.saved.clients[state.client.name.trim()] = JSON.parse(JSON.stringify(state.client));
        setStatus('Contratto salvato.', 'ok');
      }
      persist(); renderFields(); renderPreview();
    } catch (err) {
      var code = err && err.code;
      if (code === 'declined') setStatus('Download annullato.');
      else if (code === 'rate_limited') setStatus('C\'è già una richiesta di download aperta. Riprova tra poco.', 'bad');
      else setStatus('Non sono riuscito a creare il PDF' + (err && err.message ? ': ' + err.message : '.'), 'bad');
    } finally {
      btn.disabled = false;
      if (!wasPreview && window.matchMedia('(max-width:940px)').matches) setView('form');
    }
  });

  // ---------- start ----------
  syncTop(); renderFields(); update();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(renderPreview);
})();
</script>
