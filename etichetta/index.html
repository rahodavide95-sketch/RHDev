<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="SUBCONSCIOUS Culture. Techno independent label founded and curated by Raho.">
  <meta name="theme-color" content="#050609">
  <meta property="og:title" content="SUBCONSCIOUS Culture">
  <meta property="og:description" content="A new vision of underground culture, art and music.">
  <meta property="og:type" content="website">
  <title>SUBCONSCIOUS Culture</title>
  <link rel="icon" type="image/png" href="images/logo-small.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..600;1,6..96,400..600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css?v=20261110f">
</head>
<body>

  <div class="site" id="site" data-page="home">
    <!-- Fluido vivo dietro tutto il sito: prende i colori delle copertine -->
    <canvas id="gl" aria-hidden="true"></canvas>

    <header class="top">
      <div class="top-in">
        <a class="brand" href="#/" aria-label="SUBCONSCIOUS Culture, home">
          <img src="images/logo-small.png" alt="" width="32" height="32">
          <span class="wordmark"><b>SUBCONSCIOUS</b> Culture</span>
        </a>
        <input class="search" id="q" type="search" placeholder="Search releases and artists" aria-label="Search releases and artists" autocomplete="off">
        <nav class="links" id="links" aria-label="Site"></nav>
        <button class="search-btn" id="searchBtn" aria-label="Search" aria-expanded="false" aria-controls="q">
          <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="8.5" cy="8.5" r="6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M13 13l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="menu">
          <svg class="i-open" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M2 6h16M2 14h16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg class="i-close" viewBox="0 0 20 20" width="20" height="20" aria-hidden="true"><path d="M4 4l12 12M16 4L4 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
      </div>
    </header>

    <nav class="menu" id="menu" aria-label="Menu" hidden></nav>

    <!-- Misuratore di profondità: indice della pagina (uscite, anni, lettere) -->
    <div class="gauge" id="gauge" aria-label="Depth"></div>

    <main class="wrap">
      <div class="col">
        <div id="page"></div>
        <footer class="foot">
          <span id="footCopy"></span>
          <nav id="footSocial" aria-label="Social"></nav>
        </footer>
      </div>
    </main>
  </div>

  <noscript>
    <p style="padding:24px;color:#f4f1ea;font-family:sans-serif">SUBCONSCIOUS Culture. Techno independent label founded and curated by Raho. Enable JavaScript to browse the catalogue.</p>
  </noscript>

  <script src="content.js?v=20261110f"></script>
  <script src="script.js?v=20261110f"></script>
</body>
</html>
