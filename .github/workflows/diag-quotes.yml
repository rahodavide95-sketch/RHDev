name: Prova quotazioni (temporanea)
on:
  push:
    branches: [claude/diag-quotes]
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Codice vero dell'app contro onvista
        run: |
          cat > /tmp/live.mjs <<'JS'
          const M = await import(process.env.GITHUB_WORKSPACE + '/finanza-personale/js/market.js');
          const D = await import(process.env.GITHUB_WORKSPACE + '/finanza-personale/js/data/markets.js');
          const fmt = n => (n == null ? '—' : Number(n).toFixed(4));
          console.log('== Titoli del foglio di D (nome + ultimo prezzo)');
          const hs = [['Vanguard S&P 500 UCITS ETF', 133.26], ['iShares Core MSCI Emerging Markets IMI UCITS ETF', 46.37], ['Invesco Physical Gold A', 376.22], ['Xtrackers II EUR Overnight Rate Swap UCITS ETF', 149.57], ['VanEck Space Innovators UCITS ETF', 86.58], ['Rocket Lab', 83.7], ['Xtrackers EUR High Yield Corporate Bond UCITS ETF', 23.77]];
          for (const [n, p] of hs) {
            try { const c = await M.findCandidates({ name: n, price: p, currency: 'EUR' }); console.log(`${n} (${p}) → ` + c.slice(0, 3).map(x => `${x.name} ${x.isin} ${x.price ?? '?'} [${x.score.toFixed(2)}]`).join(' | ')); }
            catch (e) { console.log(n, 'ERRORE', e.message); }
          }
          console.log('== Ricerche per indici, materie prime e titoli');
          const qs = ['DAX', 'DAX 40', 'TecDAX', 'Nikkei 225', 'S&P/ASX 200', 'ASX 200', 'S&P/TSX', 'TSX', 'Jakarta Composite', 'IPC Mexico', 'Mexbol', 'Shanghai Composite', 'SSE Composite', 'NZX 50', 'VIX', 'Volatility', 'Russell 2000', 'Nikkei', 'BSE Sensex', 'Sensex', 'Nifty 50', 'KOSPI', 'Taiwan', 'TAIEX', 'Straits Times', 'Bovespa', 'Ibovespa', 'KLCI', 'FTSE Bursa', 'Dollar Index', 'US Dollar Index',
            'Goldpreis', 'Gold', 'Silberpreis', 'Silber', 'Platinpreis', 'Palladiumpreis', 'Ölpreis Brent', 'Brent', 'WTI', 'Ölpreis WTI', 'Erdgas', 'Natural Gas', 'Kupferpreis', 'Kupfer', 'Aluminiumpreis', 'Weizen', 'Mais', 'Sojabohnen', 'Hafer', 'Kaffee', 'Zucker', 'Kakao', 'Baumwolle', 'Orangensaft', 'Lebendrind', 'Holz', 'Heizöl', 'Benzin',
            'Telecom Italia', 'TIM', 'A2A', 'ERG', 'Schwab US Dividend', 'iShares 20+ Year Treasury', 'iShares 7-10 Year Treasury', 'iShares 1-3 Year Treasury', 'SPDR Bloomberg 1-3 Month T-Bill', 'iShares iBoxx Investment Grade', 'Vanguard Short-Term Inflation', 'iShares International Treasury', 'iShares Broad USD Investment Grade', 'Invesco Emerging Markets Sovereign', 'Vanguard Total International Bond', 'Vanguard Total Stock Market', 'iShares Core MSCI Emerging Markets ETF', 'Health Care Select Sector SPDR', 'Vanguard Dividend Appreciation', 'JPMorgan Equity Premium Income', 'Bitcoin'];
          for (const q of qs) {
            try { const r = await M.ovSearch(q, 6); console.log(`? ${q} → ` + r.map(x => `${x.type}:${x.name}:${x.isin || x.ev}`).join(' | ')); } catch (e) { console.log(`? ${q} → ERRORE ${e.message}`); }
          }
          console.log('== Cambi BCE');
          for (const s of ['EURUSD=X', 'USDJPY=X', 'EURCHF=X']) { try { const q = await M.quote({ symbol: s }, '1M'); console.log(s, q.price, q.closes.length, q.change?.toFixed(2)); } catch (e) { console.log(s, 'ERRORE', e.message); } }
          console.log('== Pagina Mercati (con ISIN dove c\'è)');
          const by = new Map(D.SEARCH_DB.map(x => [x.s, x]));
          let ok = 0, ko = 0;
          for (const [cat, items] of Object.entries(D.MKT_CATEGORIES)) {
            if (cat === 'Crypto' || cat === 'Materie Prime' || cat === 'Indici') continue;
            for (const it of items) {
              try { const q = await M.quote({ ...it, isin: by.get(it.symbol)?.isin || undefined, category: cat, currency: /Azioni IT/.test(cat) ? 'EUR' : undefined }, '1M'); ok++; console.log(`ok  ${cat} | ${it.name} (${it.symbol}) → ${q.name} = ${fmt(q.price)} ${q.currency || 'pt'}`); }
              catch (e) { ko++; console.log(`NO  ${cat} | ${it.name} (${it.symbol}, ${by.get(it.symbol)?.isin}) → ${e.message}`); }
            }
          }
          console.log(`TOTALE: ${ok} ok, ${ko} no`);
          JS
          node /tmp/live.mjs
