name: Deploy Supabase Edge Functions (Orbita)

# Pubblica su Supabase la funzione degli inviti di Orbita quando cambia su main.
# Servono due secret nel repository: SUPABASE_ACCESS_TOKEN e ORBITA_SUPABASE_PROJECT_REF
# (istruzioni in orbita/docs/SETUP.md). Senza i secret il job si salta.
on:
  push:
    branches: [main]
    paths:
      - 'orbita/supabase/functions/**'
      - 'orbita/supabase/config.toml'
      - '.github/workflows/deploy-orbita-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orbita-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.ORBITA_SUPABASE_PROJECT_REF }}
    defaults:
      run:
        working-directory: orbita
    steps:
      - uses: actions/checkout@v4

      - name: Controlla i secret
        id: secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::warning::Mancano SUPABASE_ACCESS_TOKEN o ORBITA_SUPABASE_PROJECT_REF: funzione NON pubblicata. Vedi orbita/docs/SETUP.md"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.secrets.outputs.skip != '1'
        with:
          version: latest

      - name: Pubblica la funzione
        if: steps.secrets.outputs.skip != '1'
        run: supabase functions deploy trip-invite --project-ref "$PROJECT_REF" --use-api
