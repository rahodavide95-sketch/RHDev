# Temporaneo: scarica i loghi ufficiali di banche e crypto per Analisi Finanziarie (poi si toglie).
name: Analisi Finanziarie - loghi
on:
  push:
    branches: [claude/finanza-temi-tabelle]
    paths: ['.github/finanza-loghi.py', '.github/workflows/finanza-loghi.yml']
permissions:
  contents: write
jobs:
  loghi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow requests
      - run: python .github/finanza-loghi.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add finanza-personale/icons finanza-personale/js/data
          git commit -m "Analisi Finanziarie: loghi delle crypto (CoinGecko) e altre banche" || echo "niente di nuovo"
          git push
