name: Deploy Supabase Edge Functions (Label Finance)

# Pubblica su Supabase le funzioni del server di Label Finance quando cambiano su main.
# Serve una sola impostazione: il secret SUPABASE_ACCESS_TOKEN nel repository
# (istruzioni in label-finance/docs/AGGIORNAMENTO.md). Senza il secret il job si salta.
on:
  push:
    branches: [main]
    paths:
      - 'label-finance/supabase/functions/**'
      - 'label-finance/supabase/config.toml'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ztjlqorvnulgfvbtvavm
    defaults:
      run:
        working-directory: label-finance
    steps:
      - uses: actions/checkout@v4

      - name: Controlla il token di Supabase
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Manca il secret SUPABASE_ACCESS_TOKEN: funzioni NON pubblicate. Vedi label-finance/docs/AGGIORNAMENTO.md"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.skip != '1'
        with:
          version: latest

      - name: Pubblica le funzioni
        if: steps.token.outputs.skip != '1'
        run: |
          set -e
          for fn in ai-advisor catalog-search create-checkout create-portal; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
          done
          # pubbliche (senza login): portale artista e webhook Stripe
          for fn in artist-statement stripe-webhook; do
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          done
