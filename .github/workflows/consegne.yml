name: Consegne (database ed email)

# Consegne ha il SUO progetto Supabase, chiamato "consegne": non condivide account, tabelle o email con
# nessun'altra app. Con il secret SUPABASE_ACCESS_TOKEN (l'accesso all'account Supabase) questo workflow:
#   1. fa girare i test (codice + sicurezza del database su un Postgres vero): se uno fallisce, si ferma;
#   2. trova il progetto "consegne" o, se non c'è ancora, lo crea (server a Francoforte, UE) — SOLO se il
#      piano Supabase è gratuito, così non costa nulla;
#   3. applica lo schema e le impostazioni di accesso (email in italiano a nome di Consegne, indirizzi di
#      ritorno, password lunghe, verifica in due passaggi) e chiude le iscrizioni appena il proprietario è
#      entrato: da lì nessun altro può nemmeno creare un account;
#   4. pubblica la funzione delle email e prova tutto dal vivo, come un estraneo senza account;
#   5. quando l'app punta al progetto di Consegne, toglie dal progetto di un'altra app le tabelle consegne_
#      messe lì il primo giorno (solo se vuote) e la sua funzione;
#   6. ogni giorno tiene sveglio il progetto (i progetti gratuiti si addormentano dopo una settimana senza uso).
# Secret facoltativi (Settings › Secrets › Actions):
#   CONSEGNE_OWNER_EMAIL      la tua email: solo lei potrà aprire l'area dell'etichetta (consigliato)
#   CONSEGNE_RESEND_API_KEY   chiave di Resend per le email degli avvisi (senza: avvisi solo nell'app)
#   CONSEGNE_MAIL_FROM        mittente, es. "SUBCONSCIOUS Culture <invio@tuodominio.com>"
#   CONSEGNE_ALLOWED_ORIGINS  indirizzi extra della pagina, es. "https://invio.tuodominio.com" (quando avrai il dominio)
on:
  push:
    branches: [main]
    paths:
      - 'consegne/supabase/**'
      - 'consegne/test/**'
      - 'consegne/js/core/**'
      - 'consegne/js/config.js'
      - '.github/workflows/consegne.yml'
  schedule:
    - cron: '37 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consegne
  cancel-in-progress: false

env:
  API: https://api.supabase.com/v1
  OLD_REF: ztjlqorvnulgfvbtvavm   # progetto di un'altra app, dove Consegne non deve più stare
  APP_URL: https://rahodavide95-sketch.github.io/RHDev/consegne/

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: consegne
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test del codice
        run: npm test
      - name: Test di sicurezza del database
        run: bash test/rls/run.sh

  deploy:
    if: github.event_name != 'schedule'
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      OWNER_EMAIL: ${{ secrets.CONSEGNE_OWNER_EMAIL }}
      RESEND_KEY: ${{ secrets.CONSEGNE_RESEND_API_KEY }}
      MAIL_FROM: ${{ secrets.CONSEGNE_MAIL_FROM }}
      EXTRA_ORIGINS: ${{ secrets.CONSEGNE_ALLOWED_ORIGINS }}
    steps:
      - uses: actions/checkout@v4

      - name: Controlla il token di Supabase
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Manca il secret SUPABASE_ACCESS_TOKEN: niente pubblicato (vedi consegne/docs/SETUP.md)."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Progetto Supabase di Consegne
        id: proj
        if: steps.token.outputs.skip != '1'
        run: |
          api() { curl -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" "$@"; }
          api "$API/projects" > /tmp/projects.json
          REF=$(jq -r '[.[] | select(.name == "consegne")][0] | (.ref // .id // empty)' /tmp/projects.json)
          if [ -z "$REF" ]; then
            ORG=$(jq -r --arg r "$OLD_REF" '[.[] | select((.ref // .id) == $r)][0].organization_id // empty' /tmp/projects.json)
            [ -n "$ORG" ] || ORG=$(api "$API/organizations" | jq -r '.[0].id // empty')
            PLAN=$(api "$API/organizations/$ORG" | jq -r '.plan // "sconosciuto"')
            echo "Piano Supabase: $PLAN"
            if [ "$PLAN" != "free" ]; then
              echo "::error::Il piano Supabase non è gratuito ($PLAN): per non farti spendere soldi non creo il progetto. Crealo tu su supabase.com con il nome \"consegne\" (regione Frankfurt) e rilancia il workflow."
              exit 1
            fi
            PASS=$(openssl rand -hex 24)
            echo "::add-mask::$PASS"
            jq -n --arg o "$ORG" --arg p "$PASS" '{name: "consegne", organization_id: $o, region: "eu-central-1", db_pass: $p}' > /tmp/new.json
            code=$(api -o /tmp/created.json -w '%{http_code}' -X POST "$API/projects" --data @/tmp/new.json)
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "::error::Progetto non creato ($code): $(jq -r '.message // .error // .' /tmp/created.json | head -c 400)"
              exit 1
            fi
            REF=$(jq -r '.ref // .id' /tmp/created.json)
            echo "Creato il progetto Supabase \"consegne\" ($REF), server a Francoforte."
          fi
          for i in $(seq 1 60); do
            st=$(api "$API/projects/$REF" | jq -r '.status // empty')
            [ "$st" = "ACTIVE_HEALTHY" ] && break
            if [ "$st" = "INACTIVE" ] && [ "$i" = 1 ]; then echo "Il progetto dormiva: lo risveglio"; api -X POST "$API/projects/$REF/restore" > /dev/null || true; fi
            echo "Stato del progetto: $st (attendo)"; sleep 10
          done
          [ "$st" = "ACTIVE_HEALTHY" ] || { echo "::error::Il progetto non è pronto (stato: $st)"; exit 1; }
          ANON=$(api "$API/projects/$REF/api-keys" | jq -r '[.[] | select(.name == "anon")][0].api_key // empty')
          [ -n "$ANON" ] || { echo "::error::Chiave pubblica del progetto non trovata"; exit 1; }
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "anon=$ANON" >> "$GITHUB_OUTPUT"
          echo "Indirizzo del progetto: https://$REF.supabase.co"
          echo "Chiave pubblica (anon, fatta per stare nel codice del browser): $ANON"
          if grep -q "$REF" consegne/js/config.js; then
            echo "L'app punta già al progetto di Consegne."
            echo "app_on_new=1" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::L'app non punta ancora al progetto di Consegne: aggiorna consegne/js/config.js con indirizzo e chiave qui sopra."
          fi

      - name: Applica lo schema
        if: steps.token.outputs.skip != '1'
        env:
          REF: ${{ steps.proj.outputs.ref }}
        run: |
          jq -Rs '{query: .}' consegne/supabase/schema.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/body.json)
          echo "Risposta $code"; head -c 2000 /tmp/out.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 1; fi

      - name: Fissa l'email del proprietario
        if: steps.token.outputs.skip != '1' && env.OWNER_EMAIL != ''
        env:
          REF: ${{ steps.proj.outputs.ref }}
        run: |
          if ! [[ "$OWNER_EMAIL" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$ ]]; then
            echo "::error::CONSEGNE_OWNER_EMAIL non sembra un indirizzo email valido."; exit 1
          fi
          jq -n --arg e "$OWNER_EMAIL" '{query: ("select public.consegne_pin_owner('"'"'" + $e + "'"'"') as esito")}' > /tmp/pin.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/pin.json)
          echo "Risposta $code: $(jq -c '.' /tmp/out.json 2>/dev/null | head -c 300)"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 1; fi

      - name: Impostazioni di accesso
        if: steps.token.outputs.skip != '1'
        env:
          REF: ${{ steps.proj.outputs.ref }}
        run: |
          q() { jq -n --arg s "$1" '{query: $s}' > /tmp/q.json; curl -sS -X POST "$API/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          OWNER=$(q "select count(*) as n from public.consegne_owner where user_id is not null" | jq -r '.[0].n // 0')
          CLOSED=false; [ "$OWNER" != "0" ] && CLOSED=true
          LIST="$APP_URL,${APP_URL}**"
          for o in $(echo "$EXTRA_ORIGINS" | tr ',' ' '); do LIST="$LIST,$o/**"; done
          jq -n --arg site "$APP_URL" --arg list "$LIST" --argjson closed "$CLOSED" '{
            site_url: $site, uri_allow_list: $list, disable_signup: $closed,
            external_email_enabled: true, mailer_autoconfirm: false, password_min_length: 10,
            mfa_totp_enroll_enabled: true, mfa_totp_verify_enabled: true
          }' > /tmp/auth.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH "$API/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/auth.json)
          echo "Accesso: risposta $code · iscrizioni $( [ "$CLOSED" = true ] && echo 'CHIUSE (il proprietario è già entrato)' || echo 'aperte finché non entra il proprietario')"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then head -c 500 /tmp/out.json; echo; exit 1; fi
          # testi delle email di accesso, in italiano e a nome di Consegne
          btn='style="display:inline-block;background:#a78bfa;color:#1b1430;text-decoration:none;font-weight:700;padding:12px 22px;border-radius:999px"'
          wrap() { echo "<div style=\"font-family:-apple-system,Segoe UI,Roboto,sans-serif;max-width:520px;margin:auto;padding:24px;color:#111\"><p style=\"font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6d28d9;font-weight:700\">Consegne</p>$1<p style=\"font-size:12px;color:#777;margin-top:24px\">Se non sei stato tu, ignora questa email: senza questo link non succede nulla.</p></div>"; }
          jq -n \
            --arg cs "Conferma il tuo account di Consegne" \
            --arg cc "$(wrap "<h2>Conferma il tuo account</h2><p>Hai creato l'account per l'area dell'etichetta su Consegne. Tocca il pulsante per confermare l'indirizzo, da questo stesso dispositivo:</p><p><a $btn href=\"{{ .ConfirmationURL }}\">Conferma l'email</a></p>")" \
            --arg rs "Nuova password per Consegne" \
            --arg rc "$(wrap "<h2>Scegli una nuova password</h2><p>Hai chiesto di cambiare la password dell'area dell'etichetta su Consegne.</p><p><a $btn href=\"{{ .ConfirmationURL }}\">Scegli la nuova password</a></p>")" \
            --arg ms "Il tuo link di accesso a Consegne" \
            --arg mc "$(wrap "<h2>Accedi a Consegne</h2><p><a $btn href=\"{{ .ConfirmationURL }}\">Accedi</a></p>")" \
            --arg es "Conferma la nuova email di Consegne" \
            --arg ec "$(wrap "<h2>Conferma la nuova email</h2><p>Stai cambiando l'email dell'account di Consegne in {{ .NewEmail }}.</p><p><a $btn href=\"{{ .ConfirmationURL }}\">Conferma</a></p>")" \
            --arg ns "Codice di conferma di Consegne" \
            --arg nc "$(wrap "<h2>Il tuo codice</h2><p style=\"font-size:28px;font-weight:700;letter-spacing:.2em\">{{ .Token }}</p>")" \
            '{mailer_subjects_confirmation: $cs, mailer_templates_confirmation_content: $cc,
              mailer_subjects_recovery: $rs, mailer_templates_recovery_content: $rc,
              mailer_subjects_magic_link: $ms, mailer_templates_magic_link_content: $mc,
              mailer_subjects_email_change: $es, mailer_templates_email_change_content: $ec,
              mailer_subjects_reauthentication: $ns, mailer_templates_reauthentication_content: $nc}' > /tmp/mail.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH "$API/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/mail.json)
          echo "Testi delle email: risposta $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "::warning::Testi delle email non aggiornati: $(head -c 300 /tmp/out.json)"; fi

      # Come manda le email di accesso Supabase. Solo numeri e sì/no: il repository è pubblico,
      # quindi niente indirizzi né altri dati personali nel registro.
      - name: Email di accesso (controllo, senza dati personali)
        if: steps.token.outputs.skip != '1'
        env:
          REF: ${{ steps.proj.outputs.ref }}
        run: |
          curl -sS "$API/projects/$REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '
            "Iscrizioni aperte: \(if .disable_signup then "no" else "sì" end)",
            "Conferma email obbligatoria: \(if .mailer_autoconfirm then "no" else "sì" end)",
            "Server email: \(if ((.smtp_host // "") != "") then "personalizzato" else "servizio gratuito di Supabase (solo verso gli indirizzi del team Supabase, poche email all’ora)" end)",
            "Limite email all’ora: \(.rate_limit_email_sent // "?")"' || true
          jq -n '{query: "select count(*) filter (where confirmation_sent_at > now() - interval '"'"'24 hours'"'"') as conferme_mandate_24h, count(*) filter (where email_confirmed_at is null) as account_da_confermare, count(*) filter (where recovery_sent_at > now() - interval '"'"'24 hours'"'"') as recuperi_password_24h, count(*) as account, (select count(*) from public.consegne_owner where user_id is not null) as proprietario from auth.users"}' > /tmp/q.json
          curl -sS -X POST "$API/projects/$REF/database/query" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" --data @/tmp/q.json | jq -c '.[0] // .' || true

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.skip != '1'
        with:
          version: latest

      - name: Impostazioni della funzione delle email
        if: steps.token.outputs.skip != '1'
        working-directory: consegne
        env:
          REF: ${{ steps.proj.outputs.ref }}
        run: |
          args=("ADMIN_URL=$APP_URL")
          [ -n "$RESEND_KEY" ] && args+=("RESEND_API_KEY=$RESEND_KEY")
          [ -n "$MAIL_FROM" ] && args+=("MAIL_FROM=$MAIL_FROM")
          [ -n "$EXTRA_ORIGINS" ] && args+=("ALLOWED_ORIGINS=$EXTRA_ORIGINS")
          supabase secrets set --yes --project-ref "$REF" "${args[@]}" > /dev/null
          echo "Impostazioni salvate: ${#args[@]}"

      - name: Pubblica la funzione delle email
        if: steps.token.outputs.skip != '1'
        working-directory: consegne
        env:
          REF: ${{ steps.proj.outputs.ref }}
        run: supabase functions deploy consegne-mail --yes --project-ref "$REF" --no-verify-jwt --use-api

      # Prova dal vivo, come un estraneo senza account: niente dati visibili, link finti rifiutati,
      # funzioni interne chiuse, funzione delle email raggiungibile. Se qualcosa non torna, il workflow è rosso.
      - name: Prova dal vivo (come un estraneo)
        if: steps.token.outputs.skip != '1'
        env:
          REF: ${{ steps.proj.outputs.ref }}
          ANON: ${{ steps.proj.outputs.anon }}
        run: |
          set -u
          URL="https://$REF.supabase.co"
          H=(-H "apikey: $ANON" -H "Authorization: Bearer $ANON" -H "Content-Type: application/json")
          FAKE=$(printf 'A%.0s' $(seq 1 43))
          fail=0
          ok() { echo "ok   $1"; }
          ko() { echo "::error::$1"; fail=1; }
          r=$(curl -sS "${H[@]}" -X POST "$URL/rest/v1/rpc/consegne_open" -d "{\"p_token\":\"$FAKE\"}")
          echo "$r" | grep -q '"not_found"' && ok "link finto: non trovato" || ko "consegne_open con link finto: $r"
          r=$(curl -sS "${H[@]}" -X POST "$URL/rest/v1/rpc/consegne_submit" -d "{\"p_token\":\"$FAKE\",\"p\":{}}")
          echo "$r" | grep -q '"not_found"' && ok "invio con link finto: rifiutato" || ko "consegne_submit con link finto: $r"
          for t in consegne_settings consegne_invites consegne_forms consegne_releases consegne_versions consegne_events consegne_owner; do
            code=$(curl -sS -o /tmp/t.json -w '%{http_code}' "${H[@]}" "$URL/rest/v1/$t?select=*&limit=1")
            if [ "$code" = 200 ] && [ "$(tr -d '[:space:]' < /tmp/t.json)" != "[]" ]; then ko "$t leggibile senza accesso: $(head -c 200 /tmp/t.json)"; else ok "$t: nessun dato visibile ($code)"; fi
          done
          for fn in consegne_mail_claim consegne_claim; do
            code=$(curl -sS -o /tmp/f.json -w '%{http_code}' "${H[@]}" -X POST "$URL/rest/v1/rpc/$fn" -d '{}')
            [ "$code" != 200 ] && ok "$fn chiusa agli estranei ($code)" || ko "$fn aperta agli estranei: $(head -c 200 /tmp/f.json)"
          done
          for i in 1 2 3 4 5 6; do
            r=$(curl -sS "${H[@]}" -X POST "$URL/functions/v1/consegne-mail" -d '{"action":"ping"}' || true)
            echo "$r" | grep -q '"email"' && break
            sleep 5
          done
          echo "$r" | grep -q '"email"' && ok "funzione delle email raggiungibile: $r" || ko "funzione delle email: $r"
          exit $fail

      # Consegne non deve stare nel progetto di un'altra app. Si toglie solo quando l'app punta già al
      # progetto di Consegne, e le tabelle si cancellano solo se sono vuote (altrimenti si avvisa e basta).
      - name: Togli Consegne dal progetto dell'altra app
        if: steps.token.outputs.skip != '1' && steps.proj.outputs.app_on_new == '1'
        run: |
          q() { jq -n --arg s "$1" '{query: $s}' > /tmp/q.json; curl -sS -X POST "$API/projects/$OLD_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json; }
          present=$(q "select to_regclass('public.consegne_forms') is not null as c" | jq -r '.[0].c // false')
          if [ "$present" = true ]; then
            n=$(q "select (select count(*) from public.consegne_forms) + (select count(*) from public.consegne_releases) + (select count(*) from public.consegne_settings) + (select count(*) from public.consegne_owner where user_id is not null) as n" | jq -r '.[0].n // -1')
            if [ "$n" = 0 ]; then
              jq -Rs '{query: .}' consegne/supabase/remove.sql > /tmp/rm.json
              code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST "$API/projects/$OLD_REF/database/query" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/rm.json)
              echo "Tabelle consegne_ tolte dall'altro progetto: risposta $code"
            else
              echo "::warning::Nell'altro progetto le tabelle consegne_ contengono dati ($n righe): non le cancello. Se non servono, toglile con consegne/supabase/remove.sql."
            fi
          else
            echo "Nell'altro progetto non ci sono più tabelle di Consegne."
          fi
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' "$API/projects/$OLD_REF/config/auth" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$code" = 200 ]; then
            jq --arg a "$APP_URL" '((.uri_allow_list // "") | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $l
              | {before: ($l | length), body: {uri_allow_list: ($l | map(select(startswith($a) | not)) | join(","))}}' /tmp/auth.json > /tmp/plan.json
            after=$(jq -r '.body.uri_allow_list | split(",") | map(select(length > 0)) | length' /tmp/plan.json)
            if [ "$after" != "$(jq -r '.before' /tmp/plan.json)" ]; then
              jq '.body' /tmp/plan.json > /tmp/patch.json
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH "$API/projects/$OLD_REF/config/auth" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/patch.json)
              echo "Indirizzi di Consegne tolti dall'altro progetto: risposta $code"
            else
              echo "Nell'altro progetto non ci sono più indirizzi di Consegne."
            fi
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$API/projects/$OLD_REF/functions/consegne-mail" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          echo "Funzione consegne-mail nell'altro progetto: $( [ "$code" = 200 ] && echo tolta || echo "già assente ($code)")"

  # I progetti Supabase gratuiti si addormentano dopo una settimana senza uso: una richiesta al giorno
  # lo tiene sveglio (così i link degli artisti funzionano sempre). Se dorme già, lo risveglia.
  sveglia:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Tieni sveglio il progetto
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || { echo "Manca SUPABASE_ACCESS_TOKEN"; exit 0; }
          REF=$(curl -sS "$API/projects" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '[.[] | select(.name == "consegne")][0] | (.ref // .id // empty)')
          [ -n "$REF" ] || { echo "Progetto consegne non ancora creato"; exit 0; }
          st=$(curl -sS "$API/projects/$REF" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '.status // empty')
          echo "Stato: $st"
          if [ "$st" = "INACTIVE" ]; then curl -sS -X POST "$API/projects/$REF/restore" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" > /dev/null; echo "Risvegliato"; exit 0; fi
          grep -q "$REF" consegne/js/config.js || { echo "L'app non punta ancora a questo progetto"; exit 0; }
          ANON=$(grep -o "supabaseAnonKey: '[^']*'" consegne/js/config.js | sed "s/supabaseAnonKey: '//; s/'$//")
          r=$(curl -sS -X POST "https://$REF.supabase.co/rest/v1/rpc/consegne_open" -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
            -H "Content-Type: application/json" -d "{\"p_token\":\"$(printf 'A%.0s' $(seq 1 43))\"}")
          echo "Risposta: $r"
