name: Database Analisi Finanziarie

# Prepara su Supabase (progetto di Label Finance, lo stesso di Documenti Raho) le tabelle finanza_personale*
# per la sincronizzazione cifrata di Analisi Finanziarie. Usa lo stesso secret SUPABASE_ACCESS_TOKEN.
# Lo script SQL si può rieseguire: crea solo ciò che manca e non tocca Label Finance né Documenti Raho.
on:
  push:
    branches: [main]
    paths:
      - 'finanza-personale/supabase/schema.sql'
      - '.github/workflows/finanza-personale-db.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: finanza-personale-db
  cancel-in-progress: false

jobs:
  schema:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ztjlqorvnulgfvbtvavm
    steps:
      - uses: actions/checkout@v4

      - name: Controlla il token di Supabase
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Manca il secret SUPABASE_ACCESS_TOKEN: tabelle NON create. Incolla finanza-personale/supabase/schema.sql nel SQL Editor di Supabase."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Applica lo schema
        if: steps.token.outputs.skip != '1'
        run: |
          jq -Rs '{query: .}' finanza-personale/supabase/schema.sql > /tmp/body.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/body.json)
          echo "Risposta $code"; head -c 2000 /tmp/out.json; echo
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then exit 1; fi

      # Il link nell'email di conferma deve riportare ad Analisi Finanziarie e non al sito di Label Finance:
      # aggiunge l'indirizzo dello strumento agli indirizzi di ritorno consentiti, senza togliere quelli
      # che ci sono già e senza cambiare il Site URL di Label Finance.
      - name: Consenti il ritorno ad Analisi Finanziarie dopo la conferma email
        if: steps.token.outputs.skip != '1'
        env:
          APP_URL: https://rahodavide95-sketch.github.io/RHDev/finanza-personale/
        run: |
          code=$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          if [ "$code" != 200 ]; then
            echo "::warning::Impostazioni di accesso non lette ($code): aggiungi a mano $APP_URL e ${APP_URL}** in Supabase › Authentication › URL Configuration › Redirect URLs."
            exit 0
          fi
          jq --arg a "$APP_URL" --arg b "${APP_URL}**" '
            ((.uri_allow_list // "") | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $l
            | {add: (([$a, $b] - $l) | length), body: {uri_allow_list: ($l + ([$a, $b] - $l) | join(","))}}' /tmp/auth.json > /tmp/plan.json
          echo "Indirizzi di ritorno già presenti: $(jq -r '(.uri_allow_list // "") | split(",") | map(select(length > 0)) | length' /tmp/auth.json)"
          if [ "$(jq '.add' /tmp/plan.json)" = 0 ]; then echo "Analisi Finanziarie è già tra gli indirizzi consentiti."; exit 0; fi
          jq '.body' /tmp/plan.json > /tmp/patch.json
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X PATCH \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data @/tmp/patch.json)
          echo "Risposta $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then head -c 500 /tmp/out.json; echo; exit 1; fi
          echo "Aggiunti $(jq '.add' /tmp/plan.json) indirizzi; ora sono $(jq -r '(.uri_allow_list // "") | split(",") | length' /tmp/out.json)."
