<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Orbita · il tuo mondo in viaggio</title>
  <meta name="description" content="Orbita: il globo dei tuoi viaggi, il passaporto del viaggiatore e i ricordi da condividere. Privato e sicuro.">
  <meta name="theme-color" content="#070910">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orbita">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/look-color.css" id="look-css">
  <script src="js/look-boot.js"></script>
  <script src="vendor/globe.gl.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body data-sheet="half">
  <div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i></div>
  <div class="stars" aria-hidden="true"></div>
  <div id="globe" role="img" aria-label="Globo interattivo con i paesi visitati"></div>

  <a class="glass capsule world-pill" id="top-chips" href="#/passaporto" aria-label="Il tuo mondo"></a>
  <button class="glass circle avatar-btn" id="avatar-btn" type="button" aria-label="Account"></button>

  <main class="sheet glass-sheet" id="panel" tabindex="-1">
    <button class="grabber" id="panel-grip" type="button" aria-label="Espandi o riduci il pannello"><span></span></button>
    <div class="sheet-scroll" id="view"></div>
  </main>

  <nav class="tabbar" aria-label="Sezioni">
    <div class="glass capsule tabbar-capsule" id="tabbar">
      <span class="tab-lens" id="tab-lens" aria-hidden="true"></span>
      <a href="#/" data-tab="home"><span class="tab-ic" data-icon="globe"></span><span class="tab-lbl">Globo</span></a>
      <a href="#/viaggi" data-tab="trips"><span class="tab-ic" data-icon="map"></span><span class="tab-lbl">Viaggi</span></a>
      <a href="#/passaporto" data-tab="passport"><span class="tab-ic" data-icon="passport"></span><span class="tab-lbl">Passaporto</span></a>
      <a href="#/account" data-tab="account"><span class="tab-ic" data-icon="user"></span><span class="tab-lbl">Profilo</span></a>
    </div>
    <button type="button" class="glass circle tinted tab-plus" id="tab-add" aria-label="Nuovo viaggio"><span class="tab-ic" data-icon="plus"></span></button>
  </nav>

  <div class="glass map-ctrls" id="globe-ctrls" role="toolbar" aria-label="Controlli del globo">
    <button type="button" data-g="in" aria-label="Avvicina" title="Avvicina"></button>
    <button type="button" data-g="out" aria-label="Allontana" title="Allontana"></button>
    <span class="sep"></span>
    <button type="button" data-g="rotate" aria-label="Rotazione automatica" title="Rotazione automatica" aria-pressed="true"></button>
    <button type="button" data-g="home" aria-label="Torna a casa" title="Torna a casa"></button>
    <button type="button" data-g="layers" aria-label="Livelli e colori" title="Livelli e colori"></button>
  </div>
  <div class="glass layers-pop" id="layers-pop" hidden></div>

  <button class="glass capsule tinted recap-btn" id="recap-fab" type="button"><span class="recap-ic"></span><span>Recap</span></button>

  <div class="stories" id="recap" hidden>
    <div class="story-bars" id="recap-bars"></div>
    <div class="story-head">
      <div class="story-title" id="recap-title"></div>
      <div class="story-btns">
        <button class="glass circle" type="button" id="recap-speed" aria-label="Velocità">1×</button>
        <button class="glass circle" type="button" id="recap-pause" aria-label="Pausa"></button>
        <button class="glass circle" type="button" id="recap-close" aria-label="Chiudi il recap"></button>
      </div>
    </div>
    <div class="glass story-card" id="recap-card"></div>
    <div class="story-hud" id="recap-hud"></div>
  </div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="boot" id="boot">
    <svg class="boot-mark" viewBox="0 0 64 64" aria-hidden="true">
      <defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop class="m1" offset="0" stop-color="#5CC4D6"/><stop class="m2" offset=".5" stop-color="#7B8CF2"/><stop class="m3" offset="1" stop-color="#A792F0"/></linearGradient></defs>
      <circle cx="32" cy="32" r="13" fill="url(#bm)"/>
      <ellipse class="m-ring" cx="32" cy="32" rx="27" ry="9.5" fill="none" stroke="url(#bm)" stroke-width="2.2" transform="rotate(-24 32 32)"/>
      <circle class="m-moon" cx="54.5" cy="21.5" r="3.6" fill="#F2C97D"/>
    </svg>
    <p>Orbita</p>
  </div>
  <noscript><div class="noscript">Orbita ha bisogno di JavaScript per mostrare il globo.</div></noscript>
</body>
</html>
